# netlify.toml — pe-content-studio
#
# IMPORTANT CHANGE from the earlier version: the /api/* proxy used to be a
# forced wildcard, which would have swallowed every NEW function added to
# this site and forwarded it to the old one. The eight legacy endpoints are
# now listed individually, so anything new resolves locally.

[build]
  publish = "."
  command = ""
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ---------------------------------------------------------------------
# Legacy AI functions. Source was lost with the old machine; they still
# run on project-briefs.netlify.app. Proxied one by one, not wildcarded.
# ---------------------------------------------------------------------
[[redirects]]
  from = "/api/ai-refresher"
  to = "https://project-briefs.netlify.app/api/ai-refresher"
  status = 200
  force = true

[[redirects]]
  from = "/api/ai-linkedin"
  to = "https://project-briefs.netlify.app/api/ai-linkedin"
  status = 200
  force = true

[[redirects]]
  from = "/api/ai-thread"
  to = "https://project-briefs.netlify.app/api/ai-thread"
  status = 200
  force = true

[[redirects]]
  from = "/api/ai-quote-cards"
  to = "https://project-briefs.netlify.app/api/ai-quote-cards"
  status = 200
  force = true

[[redirects]]
  from = "/api/ai-related"
  to = "https://project-briefs.netlify.app/api/ai-related"
  status = 200
  force = true

[[redirects]]
  from = "/api/ai-observations"
  to = "https://project-briefs.netlify.app/api/ai-observations"
  status = 200
  force = true

[[redirects]]
  from = "/api/ai-ideas"
  to = "https://project-briefs.netlify.app/api/ai-ideas"
  status = 200
  force = true

[[redirects]]
  from = "/api/corpus-add"
  to = "https://project-briefs.netlify.app/api/corpus-add"
  status = 200
  force = true

# New discovery functions declare their own paths in code
# (export const config = { path: "/api/discovery-..." }) so they need no
# redirect entries here.

# Belt and braces: set CORS at the edge too, so a preflight that never
# reaches the function still answers correctly. The functions set these as
# well; duplicating them here is harmless and covers the routing case.
[[headers]]
  for = "/api/discovery-search"
  [headers.values]
    Access-Control-Allow-Origin = "https://www.permanentequity.com"
    Access-Control-Allow-Headers = "Content-Type"
    Access-Control-Allow-Methods = "POST, OPTIONS"

[[headers]]
  for = "/api/discovery-meta"
  [headers.values]
    Access-Control-Allow-Origin = "https://www.permanentequity.com"
    Access-Control-Allow-Headers = "Content-Type"
    Access-Control-Allow-Methods = "POST, OPTIONS"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/discover.js"
  [headers.values]
    Cache-Control = "public, max-age=300"
    Access-Control-Allow-Origin = "*"

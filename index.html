<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content Studio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
<style>
  :root {
    color-scheme: light;

    --bg: #ffffff;
    --ink: #0a0a0a;
    --ink-2: #2a2a2a;
    --ink-3: #6a6a6a;
    --ink-4: #b5b5b5;
    --rule: #0a0a0a;
    --rule-soft: #ececec;
    --hairline: 1.5px;

    --sans: "Space Grotesk", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

    --t-fast: 120ms cubic-bezier(.2,.6,.2,1);
    --t-med:  240ms cubic-bezier(.2,.6,.2,1);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
  }

  a { color: var(--ink); text-decoration: none; border-bottom: 1px solid currentColor; }
  a:hover { opacity: 0.65; }

  button { font: inherit; cursor: pointer; }
  ::selection { background: var(--ink); color: var(--bg); }

  /* ---------- Atoms ---------- */

  .eyebrow {
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  .eyebrow-bar {
    display: inline-block;
    width: 22px;
    height: 3px;
    background: var(--accent, var(--ink));
    margin-right: 10px;
    vertical-align: 3px;
  }

  .signout, .back-link {
    background: none;
    border: none;
    padding: 6px 0;
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-2);
    transition: color var(--t-fast);
    border-bottom: 1.5px solid transparent;
  }
  .signout:hover, .back-link:hover { color: var(--ink); border-bottom-color: var(--ink); }
  .back-link::before { content: "← "; }

  /* ---------- Loading / error ---------- */
  .loading, .err-banner {
    display: flex; align-items: center; justify-content: center;
    min-height: 60vh; color: var(--ink-3);
    font-family: var(--sans); font-size: 16px; letter-spacing: 0.02em;
  }
  .err-banner { color: var(--ink); padding: 20px; font-weight: 500; }

  /* =====================================================================
     LOGIN SCREEN
     ===================================================================== */
  .login-shell {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 40px 20px;
    position: relative;
  }
  .login-shell::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 8px;
    background: #FF4D1F;
  }
  .login-card {
    width: 100%;
    max-width: 460px;
    background: var(--bg);
    border: var(--hairline) solid var(--rule);
    padding: 56px 44px 40px;
  }
  .login-eyebrow { display: block; margin-bottom: 18px; }
  .login-title {
    font-family: var(--sans);
    font-weight: 700;
    font-size: 48px;
    line-height: 0.98;
    letter-spacing: -0.03em;
    margin: 0 0 18px;
  }
  .login-lede {
    font-family: var(--sans);
    font-size: 16px;
    color: var(--ink-2);
    line-height: 1.5;
    margin: 0 0 32px;
    max-width: 32ch;
  }
  .login-form { display: flex; flex-direction: column; gap: 12px; }
  .login-form input[type="email"],
  .login-form input[type="password"] {
    font-family: var(--sans);
    font-size: 15px;
    padding: 14px 16px;
    border: var(--hairline) solid var(--ink);
    background: var(--bg);
    color: var(--ink);
    outline: none;
    transition: background var(--t-fast);
  }
  .login-form input[type="password"]:focus { background: #fafafa; }
  .login-form input[type="email"]:focus { background: #fafafa; }
  .login-form button {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 15px 16px;
    border: var(--hairline) solid var(--ink);
    background: var(--ink);
    color: var(--bg);
    transition: background var(--t-fast), color var(--t-fast);
  }
  .login-form button:hover:not(:disabled) { background: var(--bg); color: var(--ink); }
  .login-form button:disabled { opacity: 0.4; cursor: not-allowed; }
  .login-message {
    margin-top: 20px;
    font-size: 13.5px;
    color: var(--ink-2);
    line-height: 1.5;
  }
  .login-message.success { color: #00875A; }
  .login-message.error   { color: #D7263D; }
  .login-footer {
    margin-top: 36px;
    padding-top: 20px;
    border-top: 1px solid var(--rule-soft);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-4);
    font-weight: 500;
  }

  /* =====================================================================
     APP SHELL
     ===================================================================== */
  .app {
    max-width: 1240px;
    margin: 0 auto;
    padding: 48px 56px 96px;
  }
  .saving-pill {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--ink-3);
    letter-spacing: 0.04em;
    text-transform: none;
    opacity: 0;
    transition: opacity var(--t-med);
  }
  .saving-pill.visible { opacity: 1; }
  @media (max-width: 700px) {
    .app { padding: 32px 22px 80px; }}

  /* =====================================================================
     STUDIO SHELL (the workspace itself, behind #studio)
     ===================================================================== */
  .studio-app {
    max-width: 1240px;
    margin: 0 auto;
    padding: 48px 56px 96px;
  }
  .studio-masthead {
    display: flex; justify-content: space-between; align-items: flex-end;
    gap: 40px;
    padding-bottom: 24px;
    border-bottom: var(--hairline) solid var(--ink);
    margin-bottom: 28px;
  }
  .studio-masthead-left .eyebrow { display: block; margin-bottom: 12px; }
  .studio-masthead h1 {
    font-family: var(--sans);
    font-weight: 700;
    font-size: 56px;
    letter-spacing: -0.035em;
    line-height: 0.95;
    margin: 0;
  }
  .studio-masthead-right {
    display: flex; align-items: center; gap: 20px;
    color: var(--ink-3);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 500;
  }
  .studio-tabs {
    display: flex; gap: 0;
    border-bottom: 1px solid var(--rule-soft);
    margin-bottom: 36px;
  }
  .studio-tab {
    background: none; border: none;
    padding: 14px 20px 14px 0;
    margin-right: 28px;
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-3);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color var(--t-fast), border-color var(--t-fast);
  }
  .studio-tab:hover { color: var(--ink); }
  .studio-tab.active { color: var(--ink); border-bottom-color: #FF2E7E; }
  .studio-tab .badge {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 6px;
    background: var(--rule-soft);
    color: var(--ink-2);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0;
    border-radius: 0;
  }
  .studio-tab.active .badge { background: #FF2E7E; color: var(--bg); }
  .studio-panel { min-height: 320px; }
  .studio-placeholder {
    padding: 60px 0;
    color: var(--ink-3);
    font-size: 14px;
    letter-spacing: 0.02em;
    text-align: center;
  }

  /* Pipeline dashboard panel (top of Pipeline tab) */
  .pd-panel {
    background: var(--bg);
    border: var(--hairline) solid var(--ink);
    padding: 22px 26px 20px;
    margin-bottom: 24px;
  }
  .pd-head { margin-bottom: 18px; }
  .pd-head .eyebrow { display: block; }
  .pd-stats {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 0;
    border-top: 1px solid var(--rule-soft);
    border-bottom: 1px solid var(--rule-soft);
  }
  @media (max-width: 880px) {
    .pd-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }}
  .pd-stat {
    padding: 18px 18px 16px;
    border-right: 1px solid var(--rule-soft);
  }
  .pd-stat:last-child { border-right: none; }
  @media (max-width: 880px) {
    .pd-stat:nth-child(2n) { border-right: none; }}
  .pd-stat-value {
    font-family: var(--sans);
    font-weight: 700;
    font-size: 38px;
    line-height: 1;
    letter-spacing: -0.03em;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .pd-stat-label {
    font-family: var(--sans);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .pd-actions {
    margin-top: 16px;
  }
  .pd-actions .eyebrow { display: block; margin-bottom: 10px; }
  .pd-actions-row {
    display: flex; gap: 18px; flex-wrap: wrap;
  }

  /* Toolbar shared across studio tabs */
  .pl-toolbar, .ib-toolbar {
    display: flex; justify-content: flex-end;
    margin-bottom: 18px;
  }
  .pl-add-btn {
    background: var(--bg); color: var(--ink);
    border: var(--hairline) solid var(--ink);
    font-family: var(--sans); font-size: 11px; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase;
    padding: 9px 14px; cursor: pointer;
    transition: background var(--t-fast), color var(--t-fast);
  }
  .pl-add-btn:hover { background: var(--ink); color: var(--bg); }

  /* Masthead Studio button on homepage — filled magenta, matches the Studio accent */
  .masthead-studio-btn {
    font-family: var(--mono); font-size: 11.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: #fff;
    background: #FF2E7E;
    border: var(--hairline) solid #FF2E7E;
    padding: 7px 14px;
    cursor: pointer;
    transition: all var(--t-fast);
    box-shadow: 2px 2px 0 var(--ink);
  }

  /* Inbox list */
  .ib-list { display: flex; flex-direction: column; gap: 14px; }
  .ib-item {
    background: var(--bg);
    border: var(--hairline) solid var(--rule-soft);
    padding: 18px 22px;
  }
  .ib-item-content {
    font-family: var(--sans); font-size: 14px; line-height: 1.55;
    color: var(--ink); white-space: pre-wrap;
  }
  .ib-item-url {
    display: inline-block; margin-top: 8px;
    font-size: 11px; color: var(--ink-2); word-break: break-all;
    border-bottom: 1px solid var(--ink-2);
  }
  .ib-item-meta {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 14px; padding-top: 10px;
    border-top: 1px solid var(--rule-soft);
    font-family: var(--mono); font-size: 10px;
    color: var(--ink-3); letter-spacing: 0.04em;
  }
  .ib-action {
    background: none; border: none; padding: 4px 8px; cursor: pointer;
    font-family: var(--sans); font-size: 10px; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-2);
    transition: color var(--t-fast);
  }
  .ib-action:hover { color: var(--ink); }
  .ib-del:hover { color: #D7263D; }

  /* Glossary list */
  .gl-list { display: flex; flex-direction: column; gap: 18px; }
  .gl-item {
    border-bottom: 1px solid var(--rule-soft);
    padding-bottom: 18px;
  }
  .gl-head {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 16px;
    margin-bottom: 8px;
  }
  .gl-term {
    font-family: var(--sans); font-weight: 700; font-size: 19px;
    letter-spacing: -0.01em; color: var(--ink);
  }
  .gl-source {
    font-size: 10.5px; color: var(--ink-3);
    letter-spacing: 0.06em; text-transform: uppercase;
    font-weight: 500;
    flex-shrink: 0;
  }
  .gl-def {
    font-family: var(--sans); font-size: 14px; line-height: 1.55;
    color: var(--ink-2); white-space: pre-wrap;
  }
  .gl-notes {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 13.5px; color: var(--ink-3); line-height: 1.5;
    margin-top: 8px; padding-top: 8px;
    border-top: 1px dashed var(--rule-soft);
    font-style: italic;
  }
  .gl-meta {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    margin-top: 10px;
    font-size: 11px; color: var(--ink-3);
  }
  .gl-meta a {
    color: var(--ink-2);
    border-bottom: 1px solid var(--ink-3);
  }
  .gl-tags { font-family: var(--mono); font-size: 10.5px; }

  /* Studio modal */
  .studio-modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(10,10,10,0.55);
    z-index: 100;
    display: flex; align-items: flex-start; justify-content: center;
    padding: 8vh 20px;
    overflow-y: auto;
  }
  .studio-modal {
    background: var(--bg); color: var(--ink);
    border: var(--hairline) solid var(--ink);
    width: 100%; max-width: 720px;
    box-shadow: 6px 6px 0 #FF2E7E;
  }
  .studio-modal-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 24px 14px;
    border-bottom: var(--hairline) solid var(--ink);
  }
  .studio-modal-head h3 {
    font-family: var(--sans); font-weight: 700; font-size: 18px;
    letter-spacing: -0.01em; margin: 0;
  }
  .studio-modal-close {
    background: none; border: none; cursor: pointer;
    font-size: 24px; line-height: 1; color: var(--ink-2);
    padding: 0 4px;
  }
  .studio-modal-close:hover { color: var(--ink); }
  .studio-modal-body {
    padding: 22px 24px;
    display: flex; flex-direction: column; gap: 18px;
  }
  .studio-modal-foot {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 24px;
    border-top: 1px solid var(--rule-soft);
  }
  .sm-field {
    display: flex; flex-direction: column; gap: 6px;
  }
  .sm-field .eyebrow {
    font-size: 10px;
  }
  .sm-input {
    font-family: var(--sans); font-size: 14px;
    padding: 10px 12px;
    border: var(--hairline) solid var(--ink);
    background: var(--bg); color: var(--ink);
    outline: none; line-height: 1.45;
    transition: background var(--t-fast);
  }
  .sm-input:focus { background: #fafafa; }
  textarea.sm-input { resize: vertical; min-height: 90px; }

  /* Pieces tab */
  .pc-toolbar { margin-bottom: 14px; }
  .pc-search {
    width: 100%;
    font-family: var(--sans); font-size: 14px;
    padding: 12px 14px;
    border: var(--hairline) solid var(--ink);
    background: var(--bg); color: var(--ink);
    outline: none;
    transition: background var(--t-fast);
  }
  .pc-search:focus { background: #fafafa; }
  .pc-chips {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 16px;
  }
  .pc-chip {
    background: var(--bg); color: var(--ink-2);
    border: 1px solid var(--rule-soft);
    font-family: var(--sans); font-size: 11px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 7px 11px;
    cursor: pointer;
    transition: all var(--t-fast);
    display: inline-flex; align-items: center; gap: 8px;
  }
  .pc-chip:hover { border-color: var(--ink); color: var(--ink); }
  .pc-chip.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .pc-chip-count {
    font-family: var(--mono); font-size: 10px;
    font-weight: 500; opacity: 0.75; letter-spacing: 0;
  }
  .pc-meta {
    font-family: var(--mono); font-size: 11px; color: var(--ink-3);
    margin-bottom: 14px;
  }
  .pc-list { display: flex; flex-direction: column; gap: 0; }
  .pc-row {
    background: var(--bg); color: var(--ink);
    border: none;
    border-top: 1px solid var(--rule-soft);
    padding: 16px 4px 16px;
    cursor: pointer; text-align: left;
    font: inherit;
    transition: background var(--t-fast), padding-left var(--t-fast);
    width: 100%;
  }
  .pc-row:last-child { border-bottom: 1px solid var(--rule-soft); }
  .pc-row:hover { background: #fafafa; padding-left: 12px; }
  .pc-row-head {
    display: flex; gap: 14px; align-items: center;
    font-family: var(--sans); font-size: 10px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 6px;
  }
  .pc-row-cat { color: var(--ink-2); }
  .pc-row-len { font-family: var(--mono); letter-spacing: 0; font-size: 10.5px; }
  .pc-row-rh {
    margin-left: auto;
    font-family: var(--mono); letter-spacing: 0;
    font-size: 10.5px;
    background: #FF2E7E; color: var(--bg);
    padding: 2px 7px;
  }
  .pc-row-rh-empty {
    background: transparent; color: var(--ink-4);
    border: 1px dashed var(--ink-4);
  }
  .pc-row-title {
    font-family: var(--sans); font-weight: 600; font-size: 17px;
    letter-spacing: -0.01em; color: var(--ink);
    margin-bottom: 4px;
    word-break: break-word;
  }
  .pc-row-excerpt {
    font-size: 13px; color: var(--ink-3); line-height: 1.5;
  }
  .pc-more {
    margin: 18px auto 0; display: block;
    background: var(--bg); color: var(--ink);
    border: var(--hairline) solid var(--ink);
    padding: 10px 18px;
    font-family: var(--sans); font-size: 11px; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase;
    cursor: pointer;
    transition: background var(--t-fast), color var(--t-fast);
  }
  .pc-more:hover { background: var(--ink); color: var(--bg); }

  /* Piece detail modal */
  .pm-modal { max-width: 880px; }
  .pm-head { margin-bottom: 22px; }
  .pm-cat {
    font-family: var(--sans); font-size: 10.5px; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-3); margin-bottom: 6px;
  }
  .pm-title {
    font-family: var(--sans); font-weight: 700; font-size: 28px;
    line-height: 1.1; letter-spacing: -0.02em;
    color: var(--ink); margin: 0 0 8px;
    word-break: break-word;
  }
  .pm-url {
    font-size: 11.5px; color: var(--ink-2);
    word-break: break-all;
    border-bottom: 1px solid var(--ink-3);
  }
  .pm-actions {
    display: flex; gap: 22px; flex-wrap: wrap;
    padding: 16px 18px;
    background: #fafafa;
    border: 1px solid var(--rule-soft);
    margin-bottom: 22px;
  }
  .pm-actions-group {
    display: flex; flex-direction: column; gap: 6px;
    flex: 1; min-width: 220px;
  }
  .pm-actions-group .eyebrow {
    display: block; margin-bottom: 4px;
  }
  .pm-action {
    text-align: left;
    padding: 6px 0 !important;
  }
  .pm-action-ai {
    color: var(--ink-4) !important;
    cursor: not-allowed !important;
  }
  .pm-action-ai:hover { color: var(--ink-4) !important; }
  .pm-content {
    border-top: 1px solid var(--rule-soft);
    padding-top: 18px;
    margin-bottom: 22px;
  }
  .pm-content pre {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 15px; line-height: 1.65;
    color: var(--ink-2);
    white-space: pre-wrap; word-break: break-word;
    margin: 0; max-height: 360px; overflow-y: auto;
  }
  .pm-rh {
    border-top: 1px solid var(--rule-soft);
    padding-top: 16px;
  }
  .pm-rh .eyebrow { display: block; margin-bottom: 10px; }
  .pm-rh-empty {
    color: var(--ink-4); font-size: 13px; font-style: italic;
  }
  .pm-rh-list { list-style: none; padding: 0; margin: 0; }
  .pm-rh-list li {
    padding: 10px 0;
    border-bottom: 1px solid var(--rule-soft);
  }
  .pm-rh-list li:last-child { border-bottom: none; }
  .pm-rh-row {
    display: flex; align-items: center; gap: 12px;
    font-size: 11.5px;
  }
  .pm-rh-action {
    font-family: var(--mono); color: var(--ink-2);
    background: var(--rule-soft);
    padding: 2px 8px;
    letter-spacing: 0.02em;
  }
  .pm-rh-date {
    font-family: var(--mono); color: var(--ink-3);
    font-size: 10.5px;
  }
  .pm-rh-list li .ib-del { margin-left: auto; }
  .pm-rh-note {
    margin-top: 6px;
    font-size: 13px; color: var(--ink-2);
    line-height: 1.5;
  }
  .pm-rh-url {
    margin-top: 4px; display: inline-block;
    font-size: 11px; color: var(--ink-3);
    border-bottom: 1px solid var(--ink-3);
    word-break: break-all;
  }
  .pm-rh-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px;
  }
  .pm-rh-add {
    background: #fafafa;
    border: 1px solid var(--rule-soft);
    padding: 14px 16px;
    margin-bottom: 14px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .pm-rh-add .sm-input { font-size: 13px; padding: 8px 10px; }
  .pm-rh-add-actions {
    display: flex; justify-content: flex-end; margin-top: 4px;
  }

  /* AI output modal */
  .ai-modal { max-width: 820px; }
  .ai-modal-foot {
    display: flex; justify-content: space-between; align-items: center;
    gap: 16px;
  }
  .ai-modal-foot-left { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .ai-output-status {
    font-family: var(--mono); font-size: 11px;
    color: var(--ink-3); letter-spacing: 0.04em;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--rule-soft);
  }
  .ai-output-text {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 15px; line-height: 1.65;
    color: var(--ink);
    white-space: pre-wrap; word-break: break-word;
    margin: 0;
    max-height: 60vh; overflow-y: auto;
    min-height: 200px;
  }
  /* Related-content list */
  .ai-related-list { list-style: none; padding: 0; margin: 0; }
  .ai-related-list li {
    padding: 14px 0;
    border-bottom: 1px solid var(--rule-soft);
  }
  .ai-related-list li:last-child { border-bottom: none; }
  .ai-related-head {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 12px; margin-bottom: 6px;
  }
  .ai-related-head strong {
    font-family: var(--sans); font-weight: 700; font-size: 16px;
    letter-spacing: -0.005em;
  }
  .ai-related-sim {
    font-family: var(--mono); font-size: 11px;
    color: var(--ink-3); letter-spacing: 0;
  }
  .ai-related-why {
    font-size: 13.5px; color: var(--ink-2); line-height: 1.5;
    margin-bottom: 6px;
  }

  /* Ideas tab grid */
  .ideas-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 36px;
  }
  @media (max-width: 700px) {
    .ideas-grid { grid-template-columns: minmax(0, 1fr); }}
  .idea-card {
    background: var(--bg);
    border: var(--hairline) solid var(--ink);
    padding: 18px 20px;
    cursor: pointer; text-align: left;
    font: inherit; color: var(--ink);
    transition: transform var(--t-fast), box-shadow var(--t-fast);
  }
  .idea-card:hover {
    transform: translate(-2px, -2px);
    box-shadow: 4px 4px 0 #FF2E7E;
  }
  .idea-card-title {
    font-family: var(--sans); font-weight: 700; font-size: 17px;
    letter-spacing: -0.01em; color: var(--ink);
    margin-bottom: 6px;
  }
  .idea-card-desc {
    font-size: 13px; color: var(--ink-3); line-height: 1.5;
  }
  .ideas-freeform {
    border-top: var(--hairline) solid var(--ink);
    padding-top: 24px;
  }
  .ideas-freeform .eyebrow { display: block; margin-bottom: 10px; }
  .ideas-freeform-row {
    display: flex; gap: 8px;
  }
  .ideas-freeform-row input { flex: 1; }
  .app.detail { padding-top: 56px; }
  @media (max-width: 880px) {
    .app.detail { padding: 40px 22px 80px; }}

  /* Editable fields */
  [contenteditable="true"] {
    outline: none;
    transition: background var(--t-fast), box-shadow var(--t-fast);
    cursor: text;
  }
  [contenteditable="true"]:hover { background: #fafafa; }
  [contenteditable="true"]:focus {
    background: #fafafa;
    box-shadow: 0 0 0 2px var(--accent, var(--ink));
  }
  [contenteditable="true"].placeholder-active::before {
    content: attr(data-placeholder);
    color: var(--ink-4);
    pointer-events: none;
  }
  [contenteditable="true"].placeholder-active:focus::before { content: ""; }

  /* Toast — milestone announcer */
  .toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-14px);
    background: var(--ink);
    color: var(--bg);
    padding: 11px 22px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 220ms cubic-bezier(.2,.6,.2,1), transform 220ms cubic-bezier(.2,.6,.2,1);
    pointer-events: none;
    z-index: 1000;
    border: 1.5px solid var(--ink);
  }
  .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.big { padding: 14px 28px; font-size: 12.5px; }

  /* Magic-link fallback under password form */
  .magic-link-fallback {
    margin-top: 14px;
    background: none;
    border: none;
    padding: 6px 0;
    font-family: var(--sans);
    font-size: 12.5px;
    color: var(--ink-3);
    text-align: left;
    cursor: pointer;
    border-bottom: 1px dotted var(--ink-4);
    align-self: flex-start;
  }
  .magic-link-fallback:hover { color: var(--ink); border-bottom-color: var(--ink); }

  /* Account modal */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(10,10,10,0.4);
    z-index: 200;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal {
    background: var(--bg);
    border: 1.5px solid var(--ink);
    padding: 32px 36px 28px;
    max-width: 400px; width: 100%;
  }
  .modal h3 {
    font-family: var(--sans);
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.015em;
    margin: 0 0 8px;
    color: var(--ink);
  }
  .modal p {
    font-size: 13.5px;
    color: var(--ink-3);
    margin: 0 0 20px;
    line-height: 1.5;
  }
  .modal input[type="password"], .modal input[type="email"] {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--ink);
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
    font-family: var(--sans);
    outline: none;
    margin-bottom: 10px;
  }
  .modal input:focus { background: #fafafa; }
  .modal-actions {
    display: flex; justify-content: flex-end; gap: 10px;
    margin-top: 18px;
  }
  .modal-actions button {
    padding: 10px 18px;
    font-size: 11.5px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
    cursor: pointer;
    font-family: var(--sans);
  }
  .modal-actions .secondary { background: transparent; color: var(--ink-3); border: none; }
  .modal-actions .secondary:hover { color: var(--ink); }
  .modal-actions .primary { background: var(--ink); color: var(--bg); border: 1.5px solid var(--ink); }
  .modal-actions .primary:hover:not(:disabled) { background: var(--bg); color: var(--ink); }
  .modal-actions .primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .modal-msg { margin-top: 12px; font-size: 13px; line-height: 1.4; }
  .modal-msg.error { color: #A02828; }
  .modal-msg.success { color: #2A6E4C; }
</style>

</style>
</head>

<body>
<div id="root"><div class="loading">Loading…</div></div>

<!-- Supabase JS client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!--
  ====================================================================
  CONFIG — Supabase project URL and publishable (anon) key.
  Both are safe to expose in client code; Row Level Security is what
  actually protects the data. Unchanged from the Project Hub build —
  this app reads the same content_studio schema.
  ====================================================================
-->
<script>
  window.SUPABASE_URL = "https://sxadjumokhlqtabrqzpw.supabase.co";
  window.SUPABASE_ANON_KEY = "sb_publishable_aoFyU2eETTGOq2fLn9tpPg_5O-s-ITz";
</script>

<script>
(() => {
  const SUPABASE_URL = window.SUPABASE_URL;
  const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY;
  const CONFIGURED = SUPABASE_URL && SUPABASE_ANON_KEY
    && !SUPABASE_URL.startsWith("PASTE_") && !SUPABASE_ANON_KEY.startsWith("PASTE_");

  const PIECES_PAGE_SIZE = 50;

  const TABS = [
    { id: "pieces",   label: "Pieces" },
    { id: "ideas",    label: "Ideas" },
    { id: "glossary", label: "Glossary" },
    { id: "inbox",    label: "Inbox" }
  ];
  const TAB_IDS = TABS.map(t => t.id);
  const DEFAULT_TAB = "pieces";

  // ---------- State ----------
  const state = {
    session: null,
    loading: true,
    error: null,
    saving: false,
    saveTimer: null,
    studio: {
      loaded: false,
      loading: false,
      error: null,
      inbox: [],
      glossary: [],
      pieces: [],            // metadata only (id, url, title, category, excerpt, char_count)
      piecesCount: 0,
      rhByPiece: {}          // {piece_id: [history entries]}
    },
    studioModal: null,       // {type, item, full?, rhAddOpen?}
    aiModal: null,           // see renderAiModal for shapes
    piecesUI: {
      query: "",
      category: "all",
      underRepurposed: false,
      shown: PIECES_PAGE_SIZE,
      searchMatchIds: null,  // Set<id> when search active; null when not
      searching: false       // true while server-side query is in flight
    }
  };
  let sb = null;             // auth client (public schema)
  let sbStudio = null;       // data client, scoped to content_studio schema

  // ---------- Helpers ----------
  function escapeHtml(s) {
    if (s == null) return "";
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }
  function nowStr() {
    return new Date().toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
  }

  // ---------- Routing ----------
  // Tabs are the only routes now. Legacy #studio/x and #project=x land on Pieces
  // so old bookmarks don't dead-end.
  function currentTab() {
    const h = window.location.hash || "";
    if (/access_token|refresh_token/.test(h)) return DEFAULT_TAB;  // magic-link return
    const legacy = h.match(/^#studio(?:\/(\w+))?$/);
    if (legacy) return TAB_IDS.includes(legacy[1]) ? legacy[1] : DEFAULT_TAB;
    const m = h.match(/^#(\w+)$/);
    if (m && TAB_IDS.includes(m[1])) return m[1];
    return DEFAULT_TAB;
  }
  function goTab(tab) { window.location.hash = tab || DEFAULT_TAB; }

  // ---------- Saving indicator ----------
  function flashSaving() {
    state.saving = true;
    document.querySelectorAll(".saving-pill").forEach(el => el.classList.add("visible"));
    if (state.saveTimer) clearTimeout(state.saveTimer);
    state.saveTimer = setTimeout(() => {
      state.saving = false;
      document.querySelectorAll(".saving-pill").forEach(el => el.classList.remove("visible"));
    }, 900);
  }

  function showToast(message) {
    const el = document.createElement("div");
    el.className = "toast";
    el.textContent = message;
    document.body.appendChild(el);
    void el.offsetWidth;
    el.classList.add("visible");
    setTimeout(() => {
      el.classList.remove("visible");
      setTimeout(() => el.remove(), 260);
    }, 2600);
  }

  function showSaveError(message) {
    const existing = document.querySelector(".save-error");
    if (existing) existing.remove();
    const el = document.createElement("div");
    el.className = "toast big save-error";
    el.style.background = "#A02828";
    el.style.borderColor = "#A02828";
    el.style.color = "#FFFFFF";
    el.textContent = "Save failed — " + message;
    document.body.appendChild(el);
    void el.offsetWidth;
    el.classList.add("visible");
    setTimeout(() => {
      el.classList.remove("visible");
      setTimeout(() => el.remove(), 260);
    }, 6000);
  }

  // ---------- Auth ----------
  async function sendMagicLink(email) {
    return await sb.auth.signInWithOtp({
      email,
      options: { emailRedirectTo: window.location.origin + window.location.pathname }
    });
  }
  async function signOut() {
    await sb.auth.signOut();
    state.session = null;
    state.studio.loaded = false;
    state.studio.pieces = [];
    state.studio.inbox = [];
    state.studio.glossary = [];
    state.studio.rhByPiece = {};
    render();
  }

  function openAccountModal() {
    closeAccountModal();
    const email = state.session && state.session.user ? state.session.user.email : "";
    const html = `
      <div class="modal-backdrop" data-modal-backdrop>
        <div class="modal">
          <h3>Set a password</h3>
          <p>Use this password to sign in next time, instead of the magic-link email. Your browser will remember it for autofill.</p>
          <input type="email" value="${escapeHtml(email)}" readonly autocomplete="username" tabindex="-1" style="opacity:0.6;cursor:default">
          <input type="password" id="modal-new-password" placeholder="New password (8+ characters)" autocomplete="new-password" minlength="8">
          <div class="modal-actions">
            <button class="secondary" data-action="close-account-modal">Cancel</button>
            <button class="primary" data-action="save-password">Save password</button>
          </div>
          <div class="modal-msg" id="modal-msg" hidden></div>
        </div>
      </div>
    `;
    document.body.insertAdjacentHTML("beforeend", html);
    const backdrop = document.querySelector("[data-modal-backdrop]");
    backdrop.addEventListener("click", (e) => {
      if (e.target === backdrop) closeAccountModal();
    });
    document.querySelector("[data-action='close-account-modal']").addEventListener("click", closeAccountModal);
    document.querySelector("[data-action='save-password']").addEventListener("click", savePassword);
    const input = document.getElementById("modal-new-password");
    input.focus();
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); savePassword(); }
      if (e.key === "Escape") { e.preventDefault(); closeAccountModal(); }
    });
  }

  function closeAccountModal() {
    const el = document.querySelector("[data-modal-backdrop]");
    if (el) el.remove();
  }

  async function savePassword() {
    const input = document.getElementById("modal-new-password");
    const msgEl = document.getElementById("modal-msg");
    const password = input.value;
    if (!password || password.length < 8) {
      msgEl.className = "modal-msg error";
      msgEl.textContent = "Password must be at least 8 characters.";
      msgEl.removeAttribute("hidden");
      return;
    }
    const btn = document.querySelector("[data-action='save-password']");
    btn.disabled = true;
    btn.textContent = "Saving…";
    try {
      const { error } = await sb.auth.updateUser({ password });
      if (error) throw error;
      msgEl.className = "modal-msg success";
      msgEl.textContent = "Password set. Sign-in is faster from now on.";
      msgEl.removeAttribute("hidden");
      setTimeout(closeAccountModal, 1600);
    } catch (err) {
      msgEl.className = "modal-msg error";
      msgEl.textContent = (err && err.message) || "Couldn't save password.";
      msgEl.removeAttribute("hidden");
      btn.disabled = false;
      btn.textContent = "Save password";
    }
  }

  window.addEventListener("unhandledrejection", (e) => {
    console.error("[studio] UNHANDLED PROMISE REJECTION:", e.reason);
  });
  window.addEventListener("error", (e) => {
    console.error("[studio] UNCAUGHT ERROR:", e.message, e.error);
  });

  // ---------- Boot ----------
  async function bootApp() {
    if (!CONFIGURED) {
      state.loading = false;
      state.error = "This app hasn't been configured. Open index.html and paste your Supabase URL and anon key into the CONFIG block, then redeploy.";
      render();
      return;
    }
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });
    sbStudio = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
      db: { schema: "content_studio" }
    });

    const returningFromMagicLink = /access_token|refresh_token|error/.test(window.location.hash);
    if (returningFromMagicLink) {
      document.getElementById("root").innerHTML = `<div class="loading">Signing you in…</div>`;
    }

    sb.auth.onAuthStateChange(async (event, session) => {
      if (event === "INITIAL_SESSION" || event === "TOKEN_REFRESHED" || event === "USER_UPDATED") {
        state.session = session;
        return;
      }
      if (event === "SIGNED_IN") {
        const sameUser = state.session && session && state.session.user.id === session.user.id;
        state.session = session;
        if (sameUser) return;
        state.loading = false;
        render();
      } else if (event === "SIGNED_OUT") {
        state.session = null;
        state.loading = false;
        render();
      }
    });

    // The Supabase client restores the session from localStorage asynchronously,
    // so the first getSession() often returns null. Retry a few times.
    const maxTries = returningFromMagicLink ? 10 : 5;
    let session = null;
    for (let i = 0; i < maxTries; i++) {
      const { data } = await sb.auth.getSession();
      session = data.session;
      if (session) break;
      if (i < maxTries - 1) await new Promise(r => setTimeout(r, 150));
    }
    state.session = session;
    state.loading = false;
    render();
  }

  // ---------- Render ----------
  function render() {
    const root = document.getElementById("root");
    if (state.error && !state.session) {
      root.innerHTML = renderLogin({ message: state.error, messageKind: "error" });
      bindLoginEvents(); return;
    }
    if (!state.session) {
      root.innerHTML = renderLogin();
      bindLoginEvents(); return;
    }
    if (state.loading) { root.innerHTML = `<div class="loading">Loading…</div>`; return; }
    if (state.error) {
      root.innerHTML = `<div class="app"><div class="err-banner">${escapeHtml(state.error)}</div></div>`;
      return;
    }
    root.innerHTML = renderStudio(currentTab());
    if (!state.studio.loaded && !state.studio.loading) {
      loadStudioData().then(() => render());
    }
    bindAppEvents();
    if (state.saving) document.querySelectorAll(".saving-pill").forEach(el => el.classList.add("visible"));
  }

  // ---------- Login ----------
  function renderLogin(opts) {
    opts = opts || {};
    const msg = opts.message || "";
    const kind = opts.messageKind || "";
    return `
      <div class="login-shell">
        <div class="login-card">
          <span class="eyebrow login-eyebrow"><span class="eyebrow-bar" style="--accent:#FF2E7E"></span>The Workshop</span>
          <h1 class="login-title">Content Studio.</h1>
          <p class="login-lede">The corpus, and everything you can make from it. Sign in to continue.</p>
          <form class="login-form" id="login-form" autocomplete="on">
            <input type="email" name="email" placeholder="you@example.com" required autocomplete="email">
            <input type="password" name="password" placeholder="password" autocomplete="current-password">
            <button type="submit">Sign in</button>
          </form>
          <button class="magic-link-fallback" id="magic-link-fallback">Forgot password? Send magic link instead</button>
          ${msg ? `<div class="login-message ${escapeHtml(kind)}">${escapeHtml(msg)}</div>` : `<div class="login-message" id="login-message" hidden></div>`}
          <div class="login-footer">First time? Use the magic link option, then set a password from the Account button.</div>
        </div>
      </div>
    `;
  }

  function getLoginMsgEl(form) {
    let msgEl = document.getElementById("login-message");
    if (!msgEl) {
      msgEl = document.createElement("div");
      msgEl.id = "login-message";
      msgEl.className = "login-message";
      form.after(msgEl);
    }
    msgEl.removeAttribute("hidden");
    return msgEl;
  }

  function bindLoginEvents() {
    const form = document.getElementById("login-form");
    if (!form) return;
    const submitBtn = form.querySelector("button[type='submit']");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = form.querySelector("input[name='email']").value.trim();
      const password = form.querySelector("input[name='password']").value;
      if (!email) return;
      const msgEl = getLoginMsgEl(form);

      if (password) {
        submitBtn.disabled = true;
        submitBtn.textContent = "Signing in…";
        try {
          const { error } = await sb.auth.signInWithPassword({ email, password });
          if (error) throw error;
        } catch (err) {
          msgEl.className = "login-message error";
          msgEl.textContent = (err && err.message) || "Couldn't sign in.";
          submitBtn.disabled = false;
          submitBtn.textContent = "Sign in";
        }
      } else {
        await sendMagicLinkFlow(email, submitBtn, msgEl);
      }
    });

    const fallback = document.getElementById("magic-link-fallback");
    if (fallback) {
      fallback.addEventListener("click", async () => {
        const email = form.querySelector("input[name='email']").value.trim();
        const msgEl = getLoginMsgEl(form);
        if (!email) {
          msgEl.className = "login-message error";
          msgEl.textContent = "Enter your email first.";
          return;
        }
        await sendMagicLinkFlow(email, submitBtn, msgEl);
      });
    }
  }

  async function sendMagicLinkFlow(email, btn, msgEl) {
    btn.disabled = true;
    btn.textContent = "Sending…";
    try {
      const { error } = await sendMagicLink(email);
      if (error) throw error;
      msgEl.className = "login-message success";
      msgEl.textContent = `Magic link sent to ${email}. Check your inbox.`;
      btn.textContent = "Link sent ✓";
    } catch (err) {
      msgEl.className = "login-message error";
      msgEl.textContent = (err && err.message) || "Something went wrong. Try again.";
      btn.disabled = false;
      btn.textContent = "Sign in";
    }
  }

  /* =====================================================================
     DATA
     ===================================================================== */
  async function loadStudioData() {
    if (state.studio.loading) return;
    state.studio.loading = true;
    state.studio.error = null;
    try {
      const [ib, gl, rh] = await Promise.all([
        sbStudio.from("inbox_items").select("*").order("created_at", { ascending: false }),
        sbStudio.from("glossary_terms").select("*").order("term", { ascending: true }),
        sbStudio.from("repurpose_history").select("*").order("created_at", { ascending: false })
      ]);
      for (const r of [ib, gl, rh]) if (r.error) throw r.error;
      state.studio.inbox = ib.data || [];
      state.studio.glossary = gl.data || [];

      const byPiece = {};
      for (const e of (rh.data || [])) {
        (byPiece[e.piece_id] = byPiece[e.piece_id] || []).push(e);
      }
      state.studio.rhByPiece = byPiece;

      // Pieces metadata — paginate past the default 1000-row cap.
      const piecesMeta = [];
      let start = 0;
      while (true) {
        const { data, error } = await sbStudio
          .from("pieces")
          .select("id, url, title, category, excerpt, char_count")
          .order("title", { ascending: true })
          .range(start, start + 999);
        if (error) throw error;
        if (!data || data.length === 0) break;
        piecesMeta.push(...data);
        if (data.length < 1000) break;
        start += 1000;
      }
      state.studio.pieces = piecesMeta;

  // Debounced patch keyed on (table, rowId).
  const studioPending = new Map();
  const STUDIO_DEBOUNCE_MS = 500;
  function studioSchedulePatch(table, rowId, field, value) {
    const key = `${table}::${rowId}`;
    const entry = studioPending.get(key) || { table, rowId, patch: {}, timer: null };
    entry.patch[field] = value;
    if (entry.timer) clearTimeout(entry.timer);
    entry.timer = setTimeout(() => studioFirePatch(key), STUDIO_DEBOUNCE_MS);
    studioPending.set(key, entry);
  }
  async function studioFirePatch(key) {
    const entry = studioPending.get(key);
    if (!entry) return;
    const { table, rowId, patch } = entry;
    studioPending.delete(key);
    try {
      await studioUpdate(table, rowId, patch);
      const list = state.studio[table === "inbox_items"    ? "inbox" :
                                 table === "glossary_terms" ? "glossary" : null];
      if (list) {
        const idx = list.findIndex(r => r.id === rowId);
        if (idx >= 0) Object.assign(list[idx], patch);
      }
    } catch (err) {
      console.error("studio save failed", err);
      showSaveError(err.message || "Save failed.");
    }
  }

  /* =====================================================================
     AI API
     ===================================================================== */
  // POST to a Netlify Function with the user's JWT. Streaming endpoints pass
  // chunks to onChunk; JSON endpoints return the parsed body.
  async function studioApiStream(path, body, onChunk) {
    const token = state.session && state.session.access_token;
    if (!token) throw new Error("Not signed in.");
    const resp = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify(body || {})
    });
    if (!resp.ok) {
      const text = await resp.text().catch(() => "");
      throw new Error("API " + resp.status + ": " + text.slice(0, 200));
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      onChunk(decoder.decode(value, { stream: true }));
    }
  }
  async function studioApiJson(path, body) {
    const token = state.session && state.session.access_token;
    if (!token) throw new Error("Not signed in.");
    const resp = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify(body || {})
    });
    if (!resp.ok) {
      const text = await resp.text().catch(() => "");
      throw new Error("API " + resp.status + ": " + text.slice(0, 200));
    }
    return await resp.json();
  }

  function piecesCategoryCounts() {
    const c = {};
    for (const p of state.studio.pieces) {
      c[p.category] = (c[p.category] || 0) + 1;
    }
    return c;
  }
  function piecesFiltered() {
    let items = state.studio.pieces;
    const ui = state.piecesUI;
    if (ui.category !== "all") items = items.filter(it => it.category === ui.category);
    if (ui.underRepurposed) {
      items = items.filter(it => !state.studio.rhByPiece[it.id] || state.studio.rhByPiece[it.id].length === 0);
    }
    if (ui.query) {
      // While the server query is in flight, filter client-side on title/excerpt
      // for instant feedback; once searchMatchIds lands it becomes authoritative
      // (it also covers full content).
      if (ui.searchMatchIds) {
        items = items.filter(it => ui.searchMatchIds.has(it.id));
      } else {
        const q = ui.query.toLowerCase();
        items = items.filter(it =>
          (it.title || "").toLowerCase().includes(q) ||
          (it.excerpt || "").toLowerCase().includes(q));
      }
    }
    return items;
  }

  let _piecesSearchSeq = 0;
  async function runPiecesSearch(query) {
    const seq = ++_piecesSearchSeq;
    if (!query || !query.trim()) {
      state.piecesUI.searchMatchIds = null;
      state.piecesUI.searching = false;
      return;
    }
    // Strip ILIKE wildcards so a stray % can't match everything.
    const q = query.replace(/[%_]/g, "");
    if (!q) return;
    state.piecesUI.searching = true;
    try {
      const pattern = `%${q}%`;
      const { data, error } = await sbStudio
        .from("pieces")
        .select("id")
        .or(`title.ilike.${pattern},excerpt.ilike.${pattern},content.ilike.${pattern}`)
        .limit(500);
      if (error) throw error;
      if (seq !== _piecesSearchSeq) return;   // a newer search superseded this one
      state.piecesUI.searchMatchIds = new Set((data || []).map(r => r.id));
    } catch (e) {
      console.error("pieces search failed", e);
      state.piecesUI.searchMatchIds = null;
    } finally {
      if (seq === _piecesSearchSeq) state.piecesUI.searching = false;
    }
  }

    const obsActions = [
      { id: "obs-observations", label: "Generate observations" },
      { id: "obs-idle",         label: "What's idle / orphaned?" },
      { id: "obs-clusters",     label: "Find recent theme clusters" }
    ];
    const ideas = [
      { id: "idea-playbook",            title: "Themed Playbook ideas",      desc: "Three candidate Permanent Playbook editions, with framing line + plays + draft Situation." },
      { id: "idea-playbook-topic",      title: "Playbook on a specific topic", desc: "You pick the angle; corpus-driven plays + outside-reading suggestions." },
      { id: "idea-compilation",         title: "UO compilation / mini-book", desc: "Beer Money model: narrow theme, deep dive, 8–12 UOs ordered into a book." },
      { id: "idea-thread",              title: "Thread candidates",          desc: "Long-form pieces with thread potential that haven't been repurposed lately." },
      { id: "idea-linkedin-candidates", title: "LinkedIn candidates",        desc: "5 pieces that translate especially well to LinkedIn right now." },
      { id: "idea-quote-candidates",    title: "Quote-dense pieces",         desc: "Pieces with the highest concentration of quote-card lines." },
      { id: "idea-video",               title: "Video / animation candidates", desc: "Pieces that would adapt to a 60–90s animated video." },
      { id: "idea-resurface",           title: "Resurface candidates",       desc: "Evergreen pieces overdue for a second life." }
    ];
    return `
      <section class="pd-panel">
        <div class="pd-head">
          <span class="eyebrow"><span class="eyebrow-bar"></span>Corpus overview</span>
        </div>
        <div class="pd-stats">
          ${stats.map(s2 => `
            <div class="pd-stat" title="${escapeHtml(s2.hint)}">
              <div class="pd-stat-value">${s2.value}</div>
              <div class="pd-stat-label">${escapeHtml(s2.label)}</div>
            </div>
          `).join("")}
        </div>
        <div class="pd-actions">
          <span class="eyebrow">Observations</span>
          <div class="pd-actions-row">
            ${obsActions.map(a => `
              <button class="pl-add-btn" data-studio-action="${a.id}">${escapeHtml(a.label)}</button>
            `).join("")}
          </div>
        </div>
      </section>

      <div class="ideas-grid">
        ${ideas.map(i => `
          <button class="idea-card" data-studio-action="${i.id}">
            <div class="idea-card-title">${escapeHtml(i.title)}</div>
            <div class="idea-card-desc">${escapeHtml(i.desc)}</div>
          </button>
        `).join("")}
      </div>
      <div class="ideas-freeform">
        <span class="eyebrow"><span class="eyebrow-bar"></span>Or ask the corpus</span>
        <div class="ideas-freeform-row">
          <input id="ideaFreeForm" class="pc-search" type="text"
                 placeholder="What's the through-line between Hannah, Sometimes It's Not, and Make Hard Decisions Easy?">
          <button class="pl-add-btn" data-studio-action="idea-freeform">Ask</button>
        </div>
      </div>
    `;
  }

  /* =====================================================================
     GLOSSARY
     ===================================================================== */
  function renderStudioGlossary() {
    const items = state.studio.glossary;
    return `
      <div class="ib-toolbar">
        <button class="pl-add-btn" data-studio-action="glossary-add">+ Add a term</button>
      </div>
      ${items.length === 0
        ? `<div class="studio-placeholder">No glossary terms yet.</div>`
        : `<div class="gl-list">
            ${items.map(it => `
              <div class="gl-item" data-id="${escapeHtml(it.id)}">
                <div class="gl-head">
                  <div class="gl-term">${escapeHtml(it.term)}</div>
                  <div class="gl-source">${it.source_title ? escapeHtml(it.source_title) : (it.source_type || "")}</div>
                </div>
                <div class="gl-def">${escapeHtml(it.definition || "")}</div>
                ${it.notes ? `<div class="gl-notes">${escapeHtml(it.notes)}</div>` : ""}
                <div class="gl-meta">
                  ${it.tags ? `<span class="gl-tags">${escapeHtml(it.tags)}</span>` : ""}
                  ${it.source_url ? `<a href="${escapeHtml(it.source_url)}" target="_blank" rel="noopener">source ↗</a>` : ""}
                  <button class="ib-action" data-studio-action="glossary-edit" data-id="${escapeHtml(it.id)}">Edit</button>
                  <button class="ib-action ib-del" data-studio-action="glossary-delete" data-id="${escapeHtml(it.id)}">Delete</button>
                </div>
              </div>
            `).join("")}
          </div>`
      }
    `;
  }

  /* =====================================================================
     INBOX
     ===================================================================== */
  function renderStudioInbox() {
    const items = state.studio.inbox;
    return `
      <div class="ib-toolbar">
        <button class="pl-add-btn" data-studio-action="inbox-add">+ Quick capture</button>
      </div>
      ${items.length === 0
        ? `<div class="studio-placeholder">Inbox is empty. Drop in ideas as they show up.</div>`
        : `<div class="ib-list">
            ${items.map(it => `
              <div class="ib-item" data-id="${escapeHtml(it.id)}">
                <div class="ib-item-content">${escapeHtml(it.content || "")}</div>
                ${it.url ? `<a class="ib-item-url" href="${escapeHtml(it.url)}" target="_blank" rel="noopener">${escapeHtml(it.url)}</a>` : ""}
                <div class="ib-item-meta">
                  <span>${new Date(it.created_at).toLocaleDateString("en-US", { month: "short", day: "numeric" })}</span>
                  <div>
                    <button class="ib-action" data-studio-action="inbox-edit" data-id="${escapeHtml(it.id)}">Edit</button>
                    <button class="ib-action ib-del" data-studio-action="inbox-delete" data-id="${escapeHtml(it.id)}">Delete</button>
                  </div>
                </div>
              </div>
            `).join("")}
          </div>`
      }
    `;
  }

  /* =====================================================================
     MODALS
     ===================================================================== */
  function renderStudioModal() {
    const m = state.studioModal;
    if (!m) return "";
    if (m.type === "inbox")    return renderInboxModal(m.item);
    if (m.type === "glossary") return renderGlossaryModal(m.item);
    if (m.type === "piece")    return renderPieceModal(m.item, m.full);
    return "";
  }
  function modalShell(title, bodyHtml, item) {
    return `
      <div class="studio-modal-backdrop" data-studio-action="modal-close">
        <div class="studio-modal" data-studio-modal>
          <div class="studio-modal-head">
            <h3>${escapeHtml(title)}</h3>
            <button class="studio-modal-close" data-studio-action="modal-close" aria-label="Close">×</button>
          </div>
          <div class="studio-modal-body">
            ${bodyHtml}
          </div>
          ${item && item.id ? `
            <div class="studio-modal-foot">
              <button class="ib-action ib-del" data-studio-action="modal-delete">Delete</button>
              <span style="font-size:10.5px;color:var(--ink-3);font-family:var(--mono)">edits autosave</span>
            </div>` : ""}
        </div>
      </div>
    `;
  }
  function modalField(field, label, value, type) {
    const v = value || "";
    const tag = type === "textarea" ? "textarea" : "input";
    const attr = type === "textarea" ? "" : `type="${type || "text"}"`;
    const inner = type === "textarea" ? escapeHtml(v) : "";
    const valAttr = type === "textarea" ? "" : `value="${escapeHtml(v)}"`;
    return `
      <label class="sm-field">
        <span class="eyebrow">${escapeHtml(label)}</span>
        <${tag} class="sm-input" data-field="${field}" ${attr} ${valAttr}>${inner}${type === "textarea" ? `</textarea>` : ""}
      </label>
    `;
  }
  function renderInboxModal(item) {
    return modalShell(item.id ? "Edit inbox item" : "Quick capture", `
      ${modalField("content", "Content", item.content, "textarea")}
      ${modalField("url", "URL (optional)", item.url, "url")}
    `, item);
  }
  function renderGlossaryModal(item) {
    return modalShell(item.id ? "Edit term" : "New term", `
      ${modalField("term", "Term", item.term)}
      ${modalField("definition", "Definition", item.definition, "textarea")}
      ${modalField("source_title", "Source (title)", item.source_title)}
      ${modalField("source_url", "Source URL", item.source_url, "url")}
      ${modalField("source_type", "Source type", item.source_type)}
      ${modalField("tags", "Tags", item.tags)}
      ${modalField("notes", "Notes", item.notes, "textarea")}
    `, item);
  }

  /* =====================================================================
     ACTIONS
     ===================================================================== */
  async function handleStudioAction(e, action, id) {
    if (e && action !== "modal-close") e.stopPropagation();

    if (action === "modal-close") {
      if (e && e.target && e.currentTarget && e.target !== e.currentTarget && !e.target.classList.contains("studio-modal-close")) return;
      state.studioModal = null; render(); return;
    }
    if (action === "modal-delete") {
      const m = state.studioModal;
      if (!m || !m.item || !m.item.id) return;
      if (!confirm("Delete this item? This can't be undone.")) return;
      const tableMap = { inbox: "inbox_items", glossary: "glossary_terms" };
      const listMap  = { inbox: "inbox",       glossary: "glossary" };
      try {
        await studioDelete(tableMap[m.type], m.item.id);
        const list = state.studio[listMap[m.type]];
        const idx = list.findIndex(r => r.id === m.item.id);
        if (idx >= 0) list.splice(idx, 1);
        state.studioModal = null;
        render();
      } catch (err) {
        showSaveError(err.message || "Delete failed");
      }
      return;
    }

    /* ----- Inbox ----- */
    if (action === "inbox-add") {
      try {
        const row = await studioInsert("inbox_items", { content: "", url: "" });
        state.studio.inbox.unshift(row);
        state.studioModal = { type: "inbox", item: row };
        render();
      } catch (err) { showSaveError(err.message); }
      return;
    }
    if (action === "inbox-edit") {
      const item = state.studio.inbox.find(p => p.id === id);
      if (item) { state.studioModal = { type: "inbox", item }; render(); }
      return;
    }
    if (action === "inbox-delete") {
      if (!confirm("Delete this inbox item?")) return;
      try {
        await studioDelete("inbox_items", id);
        const list = state.studio.inbox;
        const idx = list.findIndex(r => r.id === id);
        if (idx >= 0) list.splice(idx, 1);
        render();
      } catch (err) { showSaveError(err.message); }
      return;
    }

    /* ----- Glossary ----- */
    if (action === "glossary-add") {
      try {
        const row = await studioInsert("glossary_terms", { term: "New term", definition: "" });
        state.studio.glossary.unshift(row);
        state.studioModal = { type: "glossary", item: row };
        render();
      } catch (err) { showSaveError(err.message); }
      return;
    }
    if (action === "glossary-edit") {
      const item = state.studio.glossary.find(p => p.id === id);
      if (item) { state.studioModal = { type: "glossary", item }; render(); }
      return;
    }
    if (action === "glossary-delete") {
      if (!confirm("Delete this glossary term?")) return;
      try {
        await studioDelete("glossary_terms", id);
        const list = state.studio.glossary;
        const idx = list.findIndex(r => r.id === id);
        if (idx >= 0) list.splice(idx, 1);
        render();
      } catch (err) { showSaveError(err.message); }
      return;
    }

    /* ----- Pieces ----- */
    if (action === "pieces-filter-cat") {
      const el = e && e.currentTarget;
      const cat = el && el.dataset.cat;
      if (cat) {
        state.piecesUI.category = cat;
        state.piecesUI.shown = PIECES_PAGE_SIZE;
        render();
      }
      return;
    }
    if (action === "pieces-toggle-underrepurposed") {
      state.piecesUI.underRepurposed = !state.piecesUI.underRepurposed;
      state.piecesUI.shown = PIECES_PAGE_SIZE;
      render();
      return;
    }
    if (action === "pieces-more") {
      state.piecesUI.shown += PIECES_PAGE_SIZE;
      render();
      return;
    }
    if (action === "piece-open") {
      const item = state.studio.pieces.find(p => p.id === id);
      if (!item) return;
      state.aiModal = null;           // opening a piece from ai-related closes that modal
      state.studioModal = { type: "piece", item, full: null };
      render();
      try {
        const full = await loadPieceContent(id);
        if (state.studioModal && state.studioModal.item && state.studioModal.item.id === id) {
          state.studioModal.full = full;
          render();
        }
      } catch (err) { console.error("load piece content", err); }
      return;
    }
    if (action === "piece-add-term") {
      const piece = state.studio.pieces.find(p => p.id === id);
      if (!piece) return;
      try {
        const row = await studioInsert("glossary_terms", {
          term: "",
          definition: "",
          source_title: piece.title || "",
          source_url: piece.url || "",
          source_piece_id: piece.id,
          source_type: piece.category || ""
        });
        state.studio.glossary.unshift(row);
        await logRepurpose(piece.id, "add-term", "Added a glossary term", null);
        state.studioModal = { type: "glossary", item: row };
        render();
      } catch (err) { showSaveError(err.message); }
      return;
    }

    /* ----- Repurpose history ----- */
    if (action === "rh-add-toggle") {
      if (state.studioModal && state.studioModal.type === "piece") {
        state.studioModal.rhAddOpen = !state.studioModal.rhAddOpen;
        render();
        if (state.studioModal.rhAddOpen) {
          setTimeout(() => {
            const el = document.getElementById("rhAddAction");
            if (el) el.focus();
          }, 50);
        }
      }
      return;
    }
    if (action === "rh-add-save") {
      const actionLabel = (document.getElementById("rhAddAction")?.value || "").trim();
      const note = (document.getElementById("rhAddNote")?.value || "").trim();
      const url = (document.getElementById("rhAddUrl")?.value || "").trim();
      if (!actionLabel) { showSaveError("Action label is required"); return; }
      try {
        const userId = state.session.user.id;
        const { data, error } = await sbStudio.from("repurpose_history").insert([{
          piece_id: id, user_id: userId, action: actionLabel,
          note: note || null, url: url || null
        }]).select().single();
        if (error) throw error;
        (state.studio.rhByPiece[id] = state.studio.rhByPiece[id] || []).unshift(data);
        if (state.studioModal) state.studioModal.rhAddOpen = false;
        render();
      } catch (err) { showSaveError(err.message); }
      return;
    }
    if (action === "rh-delete") {
      const rhId = e && e.currentTarget && e.currentTarget.dataset.rhId;
      if (!rhId) return;
      if (!confirm("Delete this repurpose-history entry?")) return;
      try {
        await studioDelete("repurpose_history", rhId);
        const arr = state.studio.rhByPiece[id] || [];
        const idx = arr.findIndex(x => x.id === rhId);
        if (idx >= 0) arr.splice(idx, 1);
        render();
      } catch (err) { showSaveError(err.message); }
      return;
    }

    /* ----- Add a piece by URL via the corpus-add function ----- */
    if (action === "piece-add-by-url") {
      const url = prompt("URL to add to the corpus:");
      if (!url || !/^https?:\/\//i.test(url)) return;
      flashSaving();
      try {
        const { piece, already_existed } = await studioApiJson("/api/corpus-add", { url });
        if (already_existed) {
          alert("Already in corpus: " + (piece && piece.title || "(unknown)"));
        }
        if (piece) {
          state.studio.pieces.unshift({
            id: piece.id, url: piece.url, title: piece.title, category: piece.category,
            excerpt: piece.excerpt, char_count: piece.char_count
          });
          state.studio.piecesCount = state.studio.pieces.length;
          state.piecesUI.query = "";
          state.piecesUI.searchMatchIds = null;
          state.piecesUI.shown = PIECES_PAGE_SIZE;
          render();
        }
      } catch (err) { showSaveError(err.message); }
      return;
    }

    /* ----- AI: per-piece ----- */
    if (action === "ai-refresher")   { return runAiStreamingAction({ pieceId: id, action, title: "Refresher + repurpose ideas" }); }
    if (action === "ai-linkedin")    { return runAiStreamingAction({ pieceId: id, action, title: "LinkedIn drafts" }); }
    if (action === "ai-thread")      { return runAiStreamingAction({ pieceId: id, action, title: "X/Twitter thread" }); }
    if (action === "ai-quote-cards") { return runAiStreamingAction({ pieceId: id, action, title: "Quote cards" }); }
    if (action === "ai-related")     { return runAiRelatedAction({ pieceId: id, title: "Related content" }); }

    /* ----- AI: corpus observations ----- */
    if (action === "obs-observations") { return runAiObservationAction({ mode: "observations", title: "Emerging themes" }); }
    if (action === "obs-idle")         { return runAiObservationAction({ mode: "idle", title: "Idle / orphaned" }); }
    if (action === "obs-clusters")     { return runAiObservationAction({ mode: "clusters", title: "Theme clusters" }); }

    /* ----- AI: idea generators ----- */
    if (action === "idea-playbook")            { return runAiIdeasAction({ mode: "playbook", title: "Themed Playbook ideas" }); }
    if (action === "idea-playbook-topic")      {
      const topic = prompt("What topic should the Playbook cover?");
      if (!topic) return;
      return runAiIdeasAction({ mode: "playbook-topic", topic, title: `Playbook on: ${topic}` });
    }
    if (action === "idea-compilation")         { return runAiIdeasAction({ mode: "compilation", title: "Single-theme compilation ideas" }); }
    if (action === "idea-thread")              { return runAiIdeasAction({ mode: "thread", title: "Thread candidates" }); }
    if (action === "idea-linkedin-candidates") { return runAiIdeasAction({ mode: "linkedin-candidates", title: "LinkedIn candidates" }); }
    if (action === "idea-quote-candidates")    { return runAiIdeasAction({ mode: "quote-candidates", title: "Quote-dense pieces" }); }
    if (action === "idea-video")               { return runAiIdeasAction({ mode: "video", title: "Video candidates" }); }
    if (action === "idea-resurface")           { return runAiIdeasAction({ mode: "resurface", title: "Resurface candidates" }); }
    if (action === "idea-freeform") {
      const el = document.getElementById("ideaFreeForm");
      const topic = (el && el.value || "").trim();
      if (!topic) { showSaveError("Type a question first."); return; }
      return runAiIdeasAction({ mode: "free-form", topic: `Drawing on my content corpus: ${topic}`, title: "Free-form query" });
    }

    /* ----- AI modal chrome ----- */
    if (action === "ai-modal-close") {
      if (e && e.target && e.currentTarget && e.target !== e.currentTarget && !e.target.classList.contains("studio-modal-close") && e.target.dataset.studioAction !== "ai-modal-close") return;
      state.aiModal = null; render(); return;
    }
    if (action === "ai-save-history") { return saveAiOutputToHistory(); }
    if (action === "ai-copy") {
      const m = state.aiModal;
      if (m && m.output) {
        navigator.clipboard.writeText(m.output);
        showToast("Copied to clipboard");
      }
      return;
    }
  }

  function handleStudioFieldChange(el) {
    const m = state.studioModal;
    if (!m || !m.item) return;
    const field = el.dataset.field;
    const value = el.value;
    const tableMap = { inbox: "inbox_items", glossary: "glossary_terms" };
    const table = tableMap[m.type];
    if (!table) return;
    m.item[field] = value;
    studioSchedulePatch(table, m.item.id, field, value);
  }

  /* =====================================================================
     EVENT BINDING
     ===================================================================== */
  function bindAppEvents() {
    document.querySelectorAll("[data-studio-tab]").forEach(el => {
      el.addEventListener("click", () => goTab(el.dataset.studioTab));
    });
    document.querySelectorAll("[data-studio-action]").forEach(el => {
      el.addEventListener("click", (e) => handleStudioAction(e, el.dataset.studioAction, el.dataset.id));
    });
    // Autosave fields inside any open studio modal
    document.querySelectorAll(".studio-modal [data-field]").forEach(el => {
      el.addEventListener("input", () => handleStudioFieldChange(el));
      el.addEventListener("change", () => handleStudioFieldChange(el));
    });
    document.querySelectorAll("[data-action='signout']").forEach(el => {
      el.addEventListener("click", () => signOut());
    });
    document.querySelectorAll("[data-action='account']").forEach(el => {
      el.addEventListener("click", () => openAccountModal());
    });

    // Free-form idea box: Enter submits
    const freeform = document.getElementById("ideaFreeForm");
    if (freeform) {
      freeform.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); handleStudioAction(null, "idea-freeform"); }
      });
    }

    // Pieces search — instant client-side filter, server-side content search
    // lands ~250ms later and broadens the result set.
    const searchEl = document.getElementById("piecesSearch");
    if (searchEl) {
      let t;
      searchEl.addEventListener("input", () => {
        state.piecesUI.query = searchEl.value;
        state.piecesUI.shown = PIECES_PAGE_SIZE;
        state.piecesUI.searchMatchIds = null;   // stale results — new query in flight
        clearTimeout(t);
        t = setTimeout(async () => {
          render();
          restoreSearchFocus();
          await runPiecesSearch(searchEl.value);
          render();
          restoreSearchFocus();
        }, 250);
      });
    }
    function restoreSearchFocus() {
      const again = document.getElementById("piecesSearch");
      if (again && document.activeElement !== again) {
        again.focus();
        const v = again.value;
        again.setSelectionRange(v.length, v.length);
      }
    }
  }

  // Escape closes whichever modal is open
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (state.aiModal) { state.aiModal = null; render(); return; }
    if (state.studioModal) { state.studioModal = null; render(); return; }
  });

  window.addEventListener("hashchange", render);
  bootApp();
})();

</script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PE Content Studio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Biryani:wght@600;700;800&family=Raleway:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  /* =====================================================================
     PE CONTENT STUDIO
     Navy chrome, white working surface, gold as punctuation.
     Three type roles: Biryani displays, Raleway prose, IBM Plex Mono data.
     Geometric throughout — no radii, no shadows, no gradients.
     ===================================================================== */

  :root {
    --navy:        #282E3A;
    --navy-deep:   #1C212A;
    --navy-soft:   #343B4A;
    --navy-line:   #414958;

    --gold:        #CCA33E;
    --gold-bright: #E5BC57;
    --gold-dim:    rgba(204, 163, 62, 0.18);

    --paper:       #FFFFFF;
    --surface:     #F4F4F1;   /* working surface — the middle tone */
    --tint:        #EAEAE6;
    --tint-2:      #DFDFDA;

    --ink:         #282E3A;
    --ink-2:       #565C68;
    --ink-3:       #8A8F99;
    --gray:        #BFC0C0;
    --rule:        #DCDCD6;
    --rule-soft:   #E6E6E0;

    --red:         #A02828;
    --green:       #2A6E4C;

    --display: 'Biryani', 'Helvetica Neue', sans-serif;
    --body:    'Raleway', 'Helvetica Neue', sans-serif;
    --mono:    'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;

    --gutter: 40px;
    --maxw:   1220px;
  }

  /* Dusk — hidden theme. Entre chien et loup. */
  :root.dusk {
    --surface:   #F3F1F5;
    --tint:      #E8E5EC;
    --tint-2:    #DBD7E1;
    --navy:      #2B2340;
    --navy-deep: #1E1830;
    --navy-soft: #3A3054;
    --navy-line: #493D66;
    --gold:      #D98F4E;
    --gold-bright: #EDA968;
    --gold-dim:  rgba(217, 143, 78, 0.2);
  }

  * { box-sizing: border-box; }

  html {
    -webkit-text-size-adjust: 100%;
  }

  body {
    margin: 0;
    background: var(--surface);
    color: var(--ink);
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.55;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--gold); }
  a:hover { color: var(--gold); }

  button {
    font-family: inherit;
    font-size: inherit;
    color: inherit;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
  }

  :focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  /* ---------- Eyebrow: sentence case, gold rule does the work ---------- */
  .eyebrow {
    font-family: var(--body);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--ink-3);
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .eyebrow-bar {
    display: inline-block;
    width: 22px;
    height: 2px;
    background: var(--accent, var(--gold));
    flex: none;
  }

  .loading {
    padding: 80px var(--gutter);
    font-family: var(--mono);
    font-size: 13px;
    color: var(--ink-3);
  }

  .err-banner {
    margin: 24px var(--gutter);
    padding: 16px 20px;
    border-left: 4px solid var(--red);
    background: var(--tint);
    font-size: 14px;
  }

  /* =====================================================================
     LOGIN — the one full-bleed navy moment
     ===================================================================== */
  .login-shell {
    min-height: 100vh;
    background: var(--navy);
    display: flex;
    align-items: center;
    padding: 40px var(--gutter);
  }
  .login-card {
    width: 100%;
    max-width: 460px;
  }
  .login-eyebrow { color: var(--gray); margin-bottom: 22px; }
  .login-eyebrow .eyebrow-bar { background: var(--gold); }

  .login-title {
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(40px, 7vw, 62px);
    line-height: 1.0;
    letter-spacing: 0.005em;
    color: #FFFFFF;
    margin: 0 0 18px;
  }
  .login-title .dot { color: var(--gold); }

  .login-lede {
    color: var(--gray);
    font-size: 15px;
    max-width: 34ch;
    margin: 0 0 32px;
  }

  .login-form { display: flex; flex-direction: column; gap: 12px; }
  .login-form input {
    font-family: var(--body);
    font-size: 15px;
    padding: 14px 16px;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--navy-line);
    color: #FFFFFF;
    transition: border-color 140ms;
  }
  .login-form input::placeholder { color: #6E7787; }
  .login-form input:focus { outline: none; border-color: var(--gold); }
  .login-form button {
    margin-top: 6px;
    padding: 14px 18px;
    background: var(--gold);
    color: var(--navy-deep);
    font-family: var(--display);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.02em;
    transition: background 140ms;
  }
  .login-form button:hover:not(:disabled) { background: var(--gold-bright); }
  .login-form button:disabled { opacity: 0.55; cursor: default; }

  .magic-link-fallback {
    margin-top: 16px;
    font-size: 13px;
    color: var(--gray);
    border-bottom: 1px solid var(--navy-line);
    padding-bottom: 1px;
  }
  .magic-link-fallback:hover { color: var(--gold); border-color: var(--gold); }

  .login-message {
    margin-top: 20px;
    padding: 12px 14px;
    font-size: 13px;
    font-family: var(--mono);
    border-left: 3px solid var(--navy-line);
    background: rgba(255,255,255,0.04);
    color: var(--gray);
  }
  .login-message.error   { border-color: var(--red);   color: #F0B6B6; }
  .login-message.success { border-color: var(--gold);  color: var(--gold-bright); }

  .login-footer {
    margin-top: 28px;
    font-size: 12px;
    color: #6E7787;
    max-width: 42ch;
    line-height: 1.6;
  }


  /* =====================================================================
     DISCOVERY MAINTENANCE
     Loops the enrich endpoint so you don't have to. Resumable: every job
     only picks up rows that still need work, so stopping and restarting
     costs nothing.
     ===================================================================== */
  const ENRICH_JOBS = {
    chunks:     { label: "Chunk the library",  loops: true,
                  note: "Splits pieces into passages and embeds them. ~1,300 to create." },
    situations: { label: "Embed situations",   loops: false,
                  note: "Embeds the eight canonical predicaments. Run once." },
    pieces:     { label: "Write reader notes", loops: true,
                  note: "Claude writes situations, a reader note and a pull quote per piece." },
    clusters:   { label: "Build the map",      loops: false,
                  note: "Groups the library and names each region. Run last. Safe to re-run with a different region count." },
  };

  function enrichLog(line) {
    state.enrich.log.unshift(
      new Date().toLocaleTimeString("en-US", { hour12: false }) + "  " + line);
    state.enrich.log = state.enrich.log.slice(0, 120);
    const el = document.getElementById("enrichLog");
    if (el) el.textContent = state.enrich.log.join("\n");
    else render();   // first line: the panel has no log element yet
  }

  async function runEnrichJob(job) {
    if (state.enrich.running) return;
    const spec = ENRICH_JOBS[job];
    if (!spec) return;

    state.enrich.running = true;
    state.enrich.job = job;
    state.enrich.stop = false;
    state.enrich.log = [];
    render();
    enrichLog(`Starting: ${spec.label}`);
    enrichLog("Working… the first pass reads the library and can take a moment.");

    let pass = 0, totalDone = 0;
    try {
      while (true) {
        pass++;
        const t0 = Date.now();
        const body = { job };
        if (job === "clusters") body.k = state.enrich.k || 18;
        const data = await studioApiJson("/api/discovery-enrich", body);
        const secs = ((Date.now() - t0) / 1000).toFixed(1);

        if (data.error) { enrichLog(`ERROR ${data.error}`); break; }

        if (job === "situations") { enrichLog(`Embedded ${data.embedded} situations. Done.`); break; }

        if (job === "clusters") {
          enrichLog("Clusters built:");
          (data.clusters || []).forEach(c => enrichLog(`   ${c.name}  (${c.count} pieces)`));
          break;
        }

        totalDone += (data.processed || 0);
        const made = data.chunks_created != null ? `, ${data.chunks_created} chunks` : "";
        enrichLog(`Pass ${pass}: ${data.processed || 0} done${made}, ${data.remaining} left  (${secs}s)`);

        (data.failures || []).forEach(f => enrichLog(`   failed: ${(f.title || f.id)} — ${f.error}`));

        if (data.done || !data.processed) { enrichLog(`Finished. ${totalDone} processed.`); break; }
        if (state.enrich.stop) { enrichLog(`Stopped. ${totalDone} processed, ${data.remaining} left.`); break; }
        await new Promise(r => setTimeout(r, 400));   // be kind to the APIs
      }
    } catch (e) {
      enrichLog(`ERROR ${e.message}`);
    } finally {
      state.enrich.running = false;
      state.enrich.job = null;
      render();
      loadStudioData().then(() => render());
    }
  }

  /* =====================================================================
     SHELL
     ===================================================================== */
  .studio-app { min-height: 100vh; display: flex; flex-direction: column; }

  .band-inner {
    max-width: var(--maxw);
    margin: 0 auto;
    width: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }

  .studio-masthead {
    position: relative;
    background: var(--navy);
    padding: 22px var(--gutter) 20px;
  }

  /* P. mark at far left, spanning both lines of the lockup */
  .masthead-id {
    display: flex;
    align-items: center;
    gap: 22px;
    min-width: 0;
  }
  .pe-mark-btn {
    flex: none;
    line-height: 0;
    padding: 0;
    border: none;
    background: none;
  }
  .pe-mark {
    height: 78px;
    width: auto;
    display: block;
    transition: opacity 160ms;
  }
  .pe-mark-btn:hover .pe-mark { opacity: 0.75; }
  .studio-masthead-left .eyebrow { color: var(--gray); }
  .studio-masthead-left h1 {
    font-family: var(--display);
    font-weight: 800;
    font-size: 37px;
    line-height: 1.1;
    letter-spacing: 0.005em;
    color: #FFFFFF;
    margin: 6px 0 0;
  }
  .studio-masthead-left h1 .dot { color: var(--gold); }

  .studio-masthead-right {
    display: flex;
    align-items: center;
    gap: 18px;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--gray);
  }
  .pe-mark { height: 26px; width: auto; opacity: 0.9; }

  .signout {
    font-family: var(--body);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--gray);
    padding-bottom: 2px;
    border-bottom: 1px solid transparent;
    transition: color 140ms, border-color 140ms;
  }
  .signout:hover { color: var(--gold); border-color: var(--gold); }

  .saving-pill {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--gold);
    opacity: 0;
    transition: opacity 200ms;
  }
  .saving-pill.visible { opacity: 1; }

  /* ---------- Tabs ---------- */
  .studio-tabs {
    background: var(--navy-deep);
    padding: 0 var(--gutter);
  }
  .studio-tabs .band-inner {
    align-items: stretch;
    justify-content: flex-start;
    gap: 2px;
    flex-wrap: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .studio-tabs .band-inner::-webkit-scrollbar { display: none; }

  .studio-tab {
    position: relative;
    padding: 12px 17px 11px;
    font-family: var(--display);
    font-weight: 600;
    font-size: 12.5px;
    letter-spacing: 0.02em;
    color: #99A0AD;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: color 140ms, background 140ms;
  }
  .studio-tab:hover { color: #FFFFFF; }

  /* The active tab takes the colour of the working surface, so the chrome
     and the body read as joined rather than butted against each other. */
  .studio-tab.active {
    background: var(--surface);
    color: var(--navy);
  }
  .studio-tab.active::before {
    content: '';
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 3px;
    background: var(--gold);
  }
  .studio-tab .badge {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 400;
    padding: 1px 5px;
    background: var(--navy-soft);
    color: var(--gray);
  }
  .studio-tab.active .badge { background: var(--gold-dim); color: #8A6D1E; }

  /* ---------- Working surface ---------- */
  .studio-panel {
    flex: 1;
    background: var(--surface);
    padding: 40px var(--gutter) 96px;
    max-width: calc(var(--maxw) + var(--gutter) * 2);
    width: 100%;
    margin: 0 auto;
  }

  .studio-placeholder {
    padding: 56px 0;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--ink-3);
    border-top: 1px solid var(--rule);
  }

  /* Shared small action button */
  .ib-action {
    font-family: var(--body);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-2);
    padding: 6px 11px;
    border: 1px solid var(--rule);
    background: var(--paper);
    transition: border-color 140ms, color 140ms, background 140ms;
  }
  .ib-action:hover { border-color: var(--gold); color: var(--ink); background: var(--paper); }
  .ib-action.ib-del:hover { border-color: var(--red); color: var(--red); }

  /* Shared primary button */
  .pl-add-btn {
    font-family: var(--display);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.015em;
    color: var(--navy);
    padding: 9px 15px;
    border: 1px solid var(--navy);
    background: var(--paper);
    transition: background 140ms, color 140ms;
  }
  .pl-add-btn:hover { background: var(--navy); color: #FFFFFF; }

  .ib-toolbar, .pc-toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 22px;
  }
  .ib-toolbar { justify-content: flex-end; }

  /* =====================================================================
     PIECES — the archive ledger.
     Signature: a gold left rule marks a piece you've used; a pale rule
     marks one you haven't. Scanning the column shows what's untapped.
     ===================================================================== */
  .pc-search {
    flex: 1;
    min-width: 0;
    font-family: var(--body);
    font-size: 14px;
    padding: 11px 14px;
    border: 1px solid var(--rule);
    background: var(--paper);
    color: var(--ink);
    transition: border-color 140ms;
  }
  .pc-search::placeholder { color: var(--ink-3); }
  .pc-search:focus { outline: none; border-color: var(--navy); }

  .pc-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-bottom: 18px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--rule);
  }
  .pc-chip {
    font-family: var(--body);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-2);
    padding: 6px 11px;
    border: 1px solid var(--rule);
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: all 140ms;
  }
  .pc-chip:hover { border-color: var(--ink-3); color: var(--ink); }
  .pc-chip.active {
    background: var(--navy);
    border-color: var(--navy);
    color: #FFFFFF;
  }
  .pc-chip-count {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--ink-3);
  }
  .pc-chip.active .pc-chip-count { color: var(--gold-bright); }

  .pc-meta {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--ink-3);
    margin-bottom: 14px;
  }

  .pc-list { display: flex; flex-direction: column; border-top: 1px solid var(--rule); }

  .pc-row {
    display: block;
    width: 100%;
    text-align: left;
    padding: 18px 20px 18px 22px;
    border-bottom: 1px solid var(--rule-soft);
    border-left: 3px solid var(--gold);
    transition: background 120ms, border-left-color 120ms;
  }
  .pc-row:hover { background: var(--paper); }
  .pc-row:has(.pc-row-rh-empty) { border-left-color: var(--tint-2); }
  .pc-row:has(.pc-row-rh-empty):hover { border-left-color: var(--ink-3); }

  .pc-row-head {
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin-bottom: 7px;
    font-family: var(--mono);
    font-size: 10.5px;
  }
  .pc-row-cat { color: var(--ink-2); font-weight: 500; }
  .pc-row-len { color: var(--ink-3); }
  .pc-row-rh { margin-left: auto; color: var(--gold); font-weight: 500; }
  .pc-row-rh-empty { color: var(--ink-3); font-weight: 400; }

  .pc-row-title {
    font-family: var(--display);
    font-weight: 700;
    font-size: 18px;
    line-height: 1.25;
    color: var(--ink);
    margin-bottom: 5px;
  }
  .pc-row-excerpt {
    font-size: 13.5px;
    color: var(--ink-2);
    line-height: 1.5;
    max-width: 78ch;
  }

  .pc-more {
    margin-top: 24px;
    font-family: var(--display);
    font-weight: 700;
    font-size: 13px;
    color: var(--navy);
    padding: 11px 18px;
    border: 1px solid var(--navy);
    transition: background 140ms, color 140ms;
  }
  .pc-more:hover { background: var(--navy); color: #FFFFFF; }

  /* =====================================================================
     IDEAS — corpus overview panel + generators
     ===================================================================== */
  .pd-panel {
    background: var(--navy);
    padding: 28px 32px 26px;
    margin-bottom: 40px;
  }
  .pd-head { margin-bottom: 20px; }
  .pd-head .eyebrow { display: flex; color: var(--gray); }
  .pd-head .eyebrow-bar { background: var(--gold); }

  .pd-stats {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    border-top: 1px solid var(--navy-line);
    border-bottom: 1px solid var(--navy-line);
  }
  .pd-stat {
    padding: 20px 20px 18px;
    border-right: 1px solid var(--navy-line);
    text-align: left;
    background: none;
    border-top: none;
    border-bottom: none;
    border-left: none;
    width: 100%;
    font: inherit;
    color: inherit;
    cursor: default;
  }
  .pd-stat-jump { cursor: pointer; transition: background 140ms; }
  .pd-stat-jump:hover { background: rgba(255,255,255,0.05); }
  .pd-stat-jump:hover .pd-stat-label { color: var(--gold-bright); }
  .pd-stat:last-child { border-right: none; }
  .pd-stat-value {
    font-family: var(--mono);
    font-weight: 500;
    font-size: 34px;
    line-height: 1;
    letter-spacing: -0.02em;
    color: #FFFFFF;
    margin-bottom: 9px;
    font-variant-numeric: tabular-nums;
  }
  .pd-stat:first-child .pd-stat-value { color: var(--gold); }
  .pd-stat-label {
    font-family: var(--body);
    font-size: 11.5px;
    font-weight: 600;
    color: var(--gray);
  }

  .pd-actions { margin-top: 22px; }
  .pd-actions .eyebrow { display: flex; margin-bottom: 12px; color: var(--gray); }
  .pd-actions .eyebrow-bar { background: var(--gold); }
  .pd-actions-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .pd-actions-row .pl-add-btn {
    background: transparent;
    border-color: var(--navy-line);
    color: #FFFFFF;
  }
  .pd-actions-row .pl-add-btn:hover {
    background: var(--gold);
    border-color: var(--gold);
    color: var(--navy-deep);
  }

  .ideas-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(272px, 1fr));
    border-top: 1px solid var(--rule);
    border-left: 1px solid var(--rule);
    margin-bottom: 40px;
  }
  .idea-card {
    text-align: left;
    padding: 22px 24px 24px;
    background: var(--paper);
    border-right: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    border-left: 3px solid transparent;
    transition: background 130ms, border-left-color 130ms;
  }
  .idea-card:hover { background: var(--paper); border-left-color: var(--gold); }
  .idea-card-title {
    font-family: var(--display);
    font-weight: 700;
    font-size: 16px;
    color: var(--ink);
    margin-bottom: 7px;
  }
  .idea-card-desc {
    font-size: 13px;
    color: var(--ink-2);
    line-height: 1.5;
  }

  .ideas-freeform {
    border-top: 1px solid var(--rule);
    padding-top: 26px;
  }
  .ideas-freeform .eyebrow { display: flex; margin-bottom: 14px; }
  .ideas-freeform-row { display: flex; gap: 10px; }

  /* =====================================================================
     GLOSSARY
     ===================================================================== */
  .gl-list { display: flex; flex-direction: column; }
  .gl-item {
    padding: 20px 0;
    border-bottom: 1px solid var(--rule-soft);
  }
  .gl-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 6px;
  }
  .gl-term {
    font-family: var(--display);
    font-weight: 700;
    font-size: 18px;
    color: var(--ink);
  }
  .gl-source {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--ink-3);
    text-align: right;
  }

  /* ---------- Toast ---------- */
  .toast {

  .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.big { font-size: 13px; padding: 14px 20px; }

  /* =====================================================================

     ===================================================================== */
  @media (max-width: 900px) {
    :root { --gutter: 20px; }
    .studio-masthead { align-items: flex-start; flex-direction: column; gap: 14px; }
    .studio-masthead-left h1 { font-size: 25px; }
    .pd-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .pd-stat { border-right: 1px solid var(--navy-line); border-bottom: 1px solid var(--navy-line); }

  /* =====================================================================
     PRESENTS

  .lupus {

  /* ---------- Discovery maintenance ---------- */

  .maint-k {

<body>
<div id="root"><div class="loading">Loading…</div></div>

<!-- Supabase JS client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!--
  ====================================================================
  CONFIG — Supabase project URL and publishable (anon) key.
  Both are safe to expose in client code; Row Level Security is what
  actually protects the data. Unchanged from the Project Hub build —
  this app reads the same content_studio schema.
  ====================================================================
-->
<script>
  window.SUPABASE_URL = "https://sxadjumokhlqtabrqzpw.supabase.co";
  window.SUPABASE_ANON_KEY = "sb_publishable_aoFyU2eETTGOq2fLn9tpPg_5O-s-ITz";
</script>

<script>
(() => {
  const SUPABASE_URL = window.SUPABASE_URL;
  const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY;
  const CONFIGURED = SUPABASE_URL && SUPABASE_ANON_KEY
    && !SUPABASE_URL.startsWith("PASTE_") && !SUPABASE_ANON_KEY.startsWith("PASTE_");

  const PIECES_PAGE_SIZE = 50;

  const TABS = [
    { id: "pieces",   label: "Pieces" },
    { id: "ideas",    label: "Ideas" },
    { id: "glossary", label: "Glossary" },
    { id: "inbox",    label: "Inbox" }
  ];
  const TAB_IDS = TABS.map(t => t.id);
  const DEFAULT_TAB = "pieces";

  // ---------- State ----------
  const state = {
    session: null,
    loading: true,
    error: null,
    saving: false,
    saveTimer: null,
    studio: {
      loaded: false,
      loading: false,
      error: null,
      inbox: [],
      glossary: [],
      pieces: [],            // metadata only (id, url, title, category, excerpt, char_count)
      piecesCount: 0,
      rhByPiece: {}          // {piece_id: [history entries]}
    },
    studioModal: null,       // {type, item, full?, rhAddOpen?}
    aiModal: null,           // see renderAiModal for shapes
    enrich: { running: false, job: null, log: [], stop: false, k: 18 },
    piecesUI: {
      query: "",
      category: "all",
      underRepurposed: false,
      shown: PIECES_PAGE_SIZE,
      searchMatchIds: null,  // Set<id> when search active; null when not
      searching: false       // true while server-side query is in flight
    }
  };
  let sb = null;             // auth client (public schema)
  let sbStudio = null;       // data client, scoped to content_studio schema

  // ---------- Helpers ----------
  function escapeHtml(s) {
    if (s == null) return "";
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }
  function nowStr() {
    return new Date().toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
  }

  // ---------- Routing ----------
  // Tabs are the only routes now. Legacy #studio/x and #project=x land on Pieces
  // so old bookmarks don't dead-end.
  function currentTab() {
    const h = window.location.hash || "";
    if (/access_token|refresh_token/.test(h)) return DEFAULT_TAB;  // magic-link return
    const legacy = h.match(/^#studio(?:\/(\w+))?$/);
    if (legacy) return TAB_IDS.includes(legacy[1]) ? legacy[1] : DEFAULT_TAB;
    const m = h.match(/^#(\w+)$/);
    if (m && TAB_IDS.includes(m[1])) return m[1];
    return DEFAULT_TAB;
  }
  function goTab(tab) { window.location.hash = tab || DEFAULT_TAB; }

  // ---------- Saving indicator ----------
  function flashSaving() {
    state.saving = true;
    document.querySelectorAll(".saving-pill").forEach(el => el.classList.add("visible"));
    if (state.saveTimer) clearTimeout(state.saveTimer);
    state.saveTimer = setTimeout(() => {
      state.saving = false;
      document.querySelectorAll(".saving-pill").forEach(el => el.classList.remove("visible"));
    }, 900);
  }

  function showToast(message) {
    const el = document.createElement("div");
    el.className = "toast";
    el.textContent = message;
    document.body.appendChild(el);
    void el.offsetWidth;
    el.classList.add("visible");
    setTimeout(() => {
      el.classList.remove("visible");
      setTimeout(() => el.remove(), 260);
    }, 2600);
  }

  function showSaveError(message) {
    const existing = document.querySelector(".save-error");
    if (existing) existing.remove();
    const el = document.createElement("div");
    el.className = "toast big save-error";
    el.style.background = "#A02828";
    el.style.borderColor = "#A02828";
    el.style.color = "#FFFFFF";
    el.textContent = "Save failed — " + message;
    document.body.appendChild(el);
    void el.offsetWidth;
    el.classList.add("visible");
    setTimeout(() => {
      el.classList.remove("visible");
      setTimeout(() => el.remove(), 260);
    }, 6000);
  }

  // ---------- Auth ----------
  async function sendMagicLink(email) {
    return await sb.auth.signInWithOtp({
      email,
      options: { emailRedirectTo: window.location.origin + window.location.pathname }
    });
  }
  async function signOut() {
    await sb.auth.signOut();
    state.session = null;
    state.studio.loaded = false;
    state.studio.pieces = [];
    state.studio.inbox = [];
    state.studio.glossary = [];
    state.studio.rhByPiece = {};
    render();
  }

  function openAccountModal() {
    closeAccountModal();
    const email = state.session && state.session.user ? state.session.user.email : "";
    const html = `
      <div class="modal-backdrop" data-modal-backdrop>
        <div class="modal">
          <h3>Set a password</h3>
          <p>Use this password to sign in next time, instead of the magic-link email. Your browser will remember it for autofill.</p>
          <input type="email" value="${escapeHtml(email)}" readonly autocomplete="username" tabindex="-1" style="opacity:0.6;cursor:default">
          <input type="password" id="modal-new-password" placeholder="New password (8+ characters)" autocomplete="new-password" minlength="8">
          <div class="modal-actions">
            <button class="secondary" data-action="close-account-modal">Cancel</button>
            <button class="primary" data-action="save-password">Save password</button>
          </div>
          <div class="modal-msg" id="modal-msg" hidden></div>
        </div>
      </div>
    `;
    document.body.insertAdjacentHTML("beforeend", html);
    const backdrop = document.querySelector("[data-modal-backdrop]");
    backdrop.addEventListener("click", (e) => {
      if (e.target === backdrop) closeAccountModal();
    });
    document.querySelector("[data-action='close-account-modal']").addEventListener("click", closeAccountModal);
    document.querySelector("[data-action='save-password']").addEventListener("click", savePassword);
    const input = document.getElementById("modal-new-password");
    input.focus();
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); savePassword(); }
      if (e.key === "Escape") { e.preventDefault(); closeAccountModal(); }
    });
  }

  function closeAccountModal() {
    const el = document.querySelector("[data-modal-backdrop]");
    if (el) el.remove();
  }

  async function savePassword() {
    const input = document.getElementById("modal-new-password");
    const msgEl = document.getElementById("modal-msg");
    const password = input.value;
    if (!password || password.length < 8) {
      msgEl.className = "modal-msg error";
      msgEl.textContent = "Password must be at least 8 characters.";
      msgEl.removeAttribute("hidden");
      return;
    }
    const btn = document.querySelector("[data-action='save-password']");
    btn.disabled = true;
    btn.textContent = "Saving…";
    try {
      const { error } = await sb.auth.updateUser({ password });
      if (error) throw error;
      msgEl.className = "modal-msg success";
      msgEl.textContent = "Password set. Sign-in is faster from now on.";
      msgEl.removeAttribute("hidden");
      setTimeout(closeAccountModal, 1600);
    } catch (err) {
      msgEl.className = "modal-msg error";
      msgEl.textContent = (err && err.message) || "Couldn't save password.";
      msgEl.removeAttribute("hidden");
      btn.disabled = false;
      btn.textContent = "Save password";
    }
  }

  window.addEventListener("unhandledrejection", (e) => {
    console.error("[studio] UNHANDLED PROMISE REJECTION:", e.reason);
  });
  window.addEventListener("error", (e) => {
    console.error("[studio] UNCAUGHT ERROR:", e.message, e.error);
  });

  // ---------- Boot ----------
  async function bootApp() {
    if (!CONFIGURED) {
      state.loading = false;
      state.error = "This app hasn't been configured. Open index.html and paste your Supabase URL and anon key into the CONFIG block, then redeploy.";
      render();
      return;
    }
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });
    sbStudio = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
      db: { schema: "content_studio" }
    });

    const returningFromMagicLink = /access_token|refresh_token|error/.test(window.location.hash);
    if (returningFromMagicLink) {
      document.getElementById("root").innerHTML = `<div class="loading">Signing you in…</div>`;
    }

    sb.auth.onAuthStateChange(async (event, session) => {
      if (event === "INITIAL_SESSION" || event === "TOKEN_REFRESHED" || event === "USER_UPDATED") {
        state.session = session;
        return;
      }
      if (event === "SIGNED_IN") {
        const sameUser = state.session && session && state.session.user.id === session.user.id;
        state.session = session;
        if (sameUser) return;
        state.loading = false;
        render();
      } else if (event === "SIGNED_OUT") {
        state.session = null;
        state.loading = false;
        render();
      }
    });

    // The Supabase client restores the session from localStorage asynchronously,
    // so the first getSession() often returns null. Retry a few times.
    const maxTries = returningFromMagicLink ? 10 : 5;
    let session = null;
    for (let i = 0; i < maxTries; i++) {
      const { data } = await sb.auth.getSession();
      session = data.session;
      if (session) break;
      if (i < maxTries - 1) await new Promise(r => setTimeout(r, 150));
    }
    state.session = session;
    state.loading = false;
    render();
  }

  // ---------- Render ----------
  function render() {
    const root = document.getElementById("root");
    if (state.error && !state.session) {
      root.innerHTML = renderLogin({ message: state.error, messageKind: "error" });
      bindLoginEvents(); return;
    }
    if (!state.session) {
      root.innerHTML = renderLogin();
      bindLoginEvents(); return;
    }
    if (state.loading) { root.innerHTML = `<div class="loading">Loading…</div>`; return; }
    if (state.error) {
      root.innerHTML = `<div class="app"><div class="err-banner">${escapeHtml(state.error)}</div></div>`;
      return;
    }
    root.innerHTML = renderStudio(currentTab());
    if (!state.studio.loaded && !state.studio.loading) {
      loadStudioData().then(() => render());
    }
    bindAppEvents();
    const owl = document.getElementById("owlMark");
    if (owl) owl.hidden = !cooperMode;
    const dateEl = document.getElementById("mastheadDate");
    if (dateEl) dateEl.addEventListener("dblclick", togglePresentable);

    const form = document.getElementById("login-form");
    if (!form) return;

      e.preventDefault();

      const password = form.querySelector("input[name='password']").value;
      if (!email) return;
      const msgEl = getLoginMsgEl(form);

        submitBtn.textContent = "Signing in…";

          const { error } = await sb.auth.signInWithPassword({ email, password });
          if (error) throw error;
        } catch (err) {
          msgEl.className = "login-message error";
          msgEl.textContent = (err && err.message) || "Couldn't sign in.";
          submitBtn.disabled = false;
          submitBtn.textContent = "Sign in";

     DATA
     ===================================================================== */
  async function loadStudioData() {
    if (state.studio.loading) return;
    state.studio.loading = true;
    state.studio.error = null;
    try {
      const [ib, gl, rh] = await Promise.all([
        sbStudio.from("inbox_items").select("*").order("created_at", { ascending: false }),
        sbStudio.from("glossary_terms").select("*").order("term", { ascending: true }),
        sbStudio.from("repurpose_history").select("*").order("created_at", { ascending: false })
      ]);
      for (const r of [ib, gl, rh]) if (r.error) throw r.error;
      state.studio.inbox = ib.data || [];
      state.studio.glossary = gl.data || [];

      const byPiece = {};
      for (const e of (rh.data || [])) {
        (byPiece[e.piece_id] = byPiece[e.piece_id] || []).push(e);
      }
      state.studio.rhByPiece = byPiece;

      // Pieces metadata — paginate past the default 1000-row cap.
      const piecesMeta = [];
      let start = 0;
      while (true) {
        const { data, error } = await sbStudio
          .from("pieces")
          .select("id, url, title, category, excerpt, char_count")
          .order("title", { ascending: true })
          .range(start, start + 999);
        if (error) throw error;
        if (!data || data.length === 0) break;
        piecesMeta.push(...data);
        if (data.length < 1000) break;
        start += 1000;
      }
      state.studio.pieces = piecesMeta;
      state.studio.piecesCount = piecesMeta.length;
      state.studio.loaded = true;
    } catch (e) {
      console.error("studio load failed", e);
      state.studio.error = e.message || "Couldn't load the corpus.";
    } finally {
      state.studio.loading = false;
    }
  }

  // Debounced patch keyed on (table, rowId).
  const studioPending = new Map();
  const STUDIO_DEBOUNCE_MS = 500;
  function studioSchedulePatch(table, rowId, field, value) {
    const key = `${table}::${rowId}`;
    const entry = studioPending.get(key) || { table, rowId, patch: {}, timer: null };
    entry.patch[field] = value;
    if (entry.timer) clearTimeout(entry.timer);
    entry.timer = setTimeout(() => studioFirePatch(key), STUDIO_DEBOUNCE_MS);
    studioPending.set(key, entry);
  }
  async function studioFirePatch(key) {
    const entry = studioPending.get(key);
    if (!entry) return;
    const { table, rowId, patch } = entry;
    studioPending.delete(key);
    try {
      await studioUpdate(table, rowId, patch);
      const list = state.studio[table === "inbox_items"    ? "inbox" :
                                 table === "glossary_terms" ? "glossary" : null];
      if (list) {
        const idx = list.findIndex(r => r.id === rowId);
        if (idx >= 0) Object.assign(list[idx], patch);
      }
    } catch (err) {
      console.error("studio save failed", err);
      showSaveError(err.message || "Save failed.");
    }
  }

  /* =====================================================================
     AI API
     ===================================================================== */
  // POST to a Netlify Function with the user's JWT. Streaming endpoints pass
  // chunks to onChunk; JSON endpoints return the parsed body.
  async function studioApiStream(path, body, onChunk) {
    const token = state.session && state.session.access_token;
    if (!token) throw new Error("Not signed in.");
    const resp = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify(body || {})
    });
    if (!resp.ok) {
      const text = await resp.text().catch(() => "");
      throw new Error("API " + resp.status + ": " + text.slice(0, 200));
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      onChunk(decoder.decode(value, { stream: true }));
    }
  }
  async function studioApiJson(path, body) {
    const token = state.session && state.session.access_token;
    if (!token) throw new Error("Not signed in.");
    const resp = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify(body || {})
    });
    if (!resp.ok) {
      const text = await resp.text().catch(() => "");
      throw new Error("API " + resp.status + ": " + text.slice(0, 200));
    }
    return await resp.json();
  }

  /* =====================================================================
     DISCOVERY MAINTENANCE
     Loops the enrich endpoint so you don't have to. Resumable: every job
     only picks up rows that still need work, so stopping and restarting
     costs nothing.
     ===================================================================== */
  const ENRICH_JOBS = {
    chunks:     { label: "Chunk the library",  loops: true,
                  note: "Splits pieces into passages and embeds them. ~1,300 to create." },
    situations: { label: "Embed situations",   loops: false,
                  note: "Embeds the eight canonical predicaments. Run once." },
    pieces:     { label: "Write reader notes", loops: true,
                  note: "Claude writes situations, a reader note and a pull quote per piece." },
    clusters:   { label: "Build the map",      loops: false,
                  note: "Groups the library and names each region. Run last. Safe to re-run with a different region count." },
  };

  function enrichLog(line) {
    state.enrich.log.unshift(
      new Date().toLocaleTimeString("en-US", { hour12: false }) + "  " + line);
    state.enrich.log = state.enrich.log.slice(0, 120);
    const el = document.getElementById("enrichLog");
    if (el) el.textContent = state.enrich.log.join("\n");
    else render();   // first line: the panel has no log element yet
  }

  async function runEnrichJob(job) {
    if (state.enrich.running) return;
    const spec = ENRICH_JOBS[job];
    if (!spec) return;

    state.enrich.running = true;
    state.enrich.job = job;
    state.enrich.stop = false;
    state.enrich.log = [];
    render();
    enrichLog(`Starting: ${spec.label}`);
    enrichLog("Working… the first pass reads the library and can take a moment.");

    let pass = 0, totalDone = 0;
    try {
      while (true) {
        pass++;
        const t0 = Date.now();
        const body = { job };
        if (job === "clusters") body.k = state.enrich.k || 18;
        const data = await studioApiJson("/api/discovery-enrich", body);
        const secs = ((Date.now() - t0) / 1000).toFixed(1);

        if (data.error) { enrichLog(`ERROR ${data.error}`); break; }

        if (job === "situations") { enrichLog(`Embedded ${data.embedded} situations. Done.`); break; }

        if (job === "clusters") {
          enrichLog("Clusters built:");
          (data.clusters || []).forEach(c => enrichLog(`   ${c.name}  (${c.count} pieces)`));
          break;
        }

        totalDone += (data.processed || 0);
        const made = data.chunks_created != null ? `, ${data.chunks_created} chunks` : "";
        enrichLog(`Pass ${pass}: ${data.processed || 0} done${made}, ${data.remaining} left  (${secs}s)`);

        (data.failures || []).forEach(f => enrichLog(`   failed: ${(f.title || f.id)} — ${f.error}`));

        if (data.done || !data.processed) { enrichLog(`Finished. ${totalDone} processed.`); break; }
        if (state.enrich.stop) { enrichLog(`Stopped. ${totalDone} processed, ${data.remaining} left.`); break; }
        await new Promise(r => setTimeout(r, 400));   // be kind to the APIs
      }
    } catch (e) {
      enrichLog(`ERROR ${e.message}`);
    } finally {
      state.enrich.running = false;
      state.enrich.job = null;
      render();
      loadStudioData().then(() => render());
    }
  }

     ===================================================================== */
  function piecesCategoryCounts() {
    const c = {};
    for (const p of state.studio.pieces) {
      c[p.category] = (c[p.category] || 0) + 1;
    }
    return c;
  }
  function piecesFiltered() {
    let items = state.studio.pieces;
    const ui = state.piecesUI;
    if (ui.category !== "all") items = items.filter(it => it.category === ui.category);
    if (ui.underRepurposed) {
      items = items.filter(it => !state.studio.rhByPiece[it.id] || state.studio.rhByPiece[it.id].length === 0);
    }
    if (ui.query) {
      // While the server query is in flight, filter client-side on title/excerpt
      // for instant feedback; once searchMatchIds lands it becomes authoritative
      // (it also covers full content).
      if (ui.searchMatchIds) {
        items = items.filter(it => ui.searchMatchIds.has(it.id));
      } else {
        const q = ui.query.toLowerCase();
        items = items.filter(it =>
          (it.title || "").toLowerCase().includes(q) ||
          (it.excerpt || "").toLowerCase().includes(q));
      }
    }
    return items;
  }

  let _piecesSearchSeq = 0;
  async function runPiecesSearch(query) {
    const seq = ++_piecesSearchSeq;
    if (!query || !query.trim()) {
      state.piecesUI.searchMatchIds = null;
      state.piecesUI.searching = false;
      return;
    }
    // Strip ILIKE wildcards so a stray % can't match everything.
    const q = query.replace(/[%_]/g, "");
    if (!q) return;
    state.piecesUI.searching = true;
    try {
      const pattern = `%${q}%`;
      const { data, error } = await sbStudio
        .from("pieces")
        .select("id")
        .or(`title.ilike.${pattern},excerpt.ilike.${pattern},content.ilike.${pattern}`)
        .limit(500);
      if (error) throw error;
      if (seq !== _piecesSearchSeq) return;   // a newer search superseded this one
      state.piecesUI.searchMatchIds = new Set((data || []).map(r => r.id));
    } catch (e) {
      console.error("pieces search failed", e);
      state.piecesUI.searchMatchIds = null;
    } finally {
      if (seq === _piecesSearchSeq) state.piecesUI.searching = false;
    }
  }

  /* =====================================================================

  async function handleStudioAction(e, action, id) {
    if (e && action !== "modal-close") e.stopPropagation();

    if (action === "modal-close") {
      if (e && e.target && e.currentTarget && e.target !== e.currentTarget && !e.target.classList.contains("studio-modal-close")) return;
      state.studioModal = null; render(); return;
    }
    if (action === "modal-delete") {
      const m = state.studioModal;
      if (!m || !m.item || !m.item.id) return;
      if (!confirm("Delete this item? This can't be undone.")) return;
      const tableMap = { inbox: "inbox_items", glossary: "glossary_terms" };
      const listMap  = { inbox: "inbox",       glossary: "glossary" };
      try {
        await studioDelete(tableMap[m.type], m.item.id);
        const list = state.studio[listMap[m.type]];
        const idx = list.findIndex(r => r.id === m.item.id);
        if (idx >= 0) list.splice(idx, 1);
        state.studioModal = null;
        render();
      } catch (err) {
        showSaveError(err.message || "Delete failed");
      }
      return;
    }

    /* ----- Inbox ----- */
    if (action === "inbox-add") {
      try {
        const row = await studioInsert("inbox_items", { content: "", url: "" });
        state.studio.inbox.unshift(row);
        state.studioModal = { type: "inbox", item: row };
        render();
      } catch (err) { showSaveError(err.message); }
      return;
    }
    if (action === "inbox-edit") {
      const item = state.studio.inbox.find(p => p.id === id);
      if (item) { state.studioModal = { type: "inbox", item }; render(); }
      return;
    }
    if (action === "inbox-delete") {
      if (!confirm("Delete this inbox item?")) return;
      try {
        await studioDelete("inbox_items", id);
        const list = state.studio.inbox;
        const idx = list.findIndex(r => r.id === id);
        if (idx >= 0) list.splice(idx, 1);
        render();
      } catch (err) { showSaveError(err.message); }
      return;
    }

    /* ----- Glossary ----- */
    if (action === "glossary-add") {
      try {
        const row = await studioInsert("glossary_terms", { term: "New term", definition: "" });
        state.studio.glossary.unshift(row);
        state.studioModal = { type: "glossary", item: row };
        render();
      } catch (err) { showSaveError(err.message); }
      return;
    }
    if (action === "glossary-edit") {
      const item = state.studio.glossary.find(p => p.id === id);
      if (item) { state.studioModal = { type: "glossary", item }; render(); }
      return;
    }
    if (action === "glossary-delete") {
      if (!confirm("Delete this glossary term?")) return;
      try {
        await studioDelete("glossary_terms", id);
        const list = state.studio.glossary;
        const idx = list.findIndex(r => r.id === id);
        if (idx >= 0) list.splice(idx, 1);
        render();
      } catch (err) { showSaveError(err.message); }
      return;
    }

    /* ----- Pieces ----- */
    if (action === "pieces-filter-cat") {
      const el = e && e.currentTarget;
      const cat = el && el.dataset.cat;
      if (cat) {
        state.piecesUI.category = cat;
        state.piecesUI.shown = PIECES_PAGE_SIZE;
        render();
      }
      return;
    }
    if (action === "pieces-toggle-underrepurposed") {
      state.piecesUI.underRepurposed = !state.piecesUI.underRepurposed;
      state.piecesUI.shown = PIECES_PAGE_SIZE;
      render();
      return;
    }
    if (action === "pieces-more") {
      state.piecesUI.shown += PIECES_PAGE_SIZE;
      render();
      return;
    }
    if (action === "piece-open") {
      const item = state.studio.pieces.find(p => p.id === id);
      if (!item) return;
      state.aiModal = null;           // opening a piece from ai-related closes that modal
      state.studioModal = { type: "piece", item, full: null };
      render();
      try {
        const full = await loadPieceContent(id);
        if (state.studioModal && state.studioModal.item && state.studioModal.item.id === id) {
          state.studioModal.full = full;
          render();
        }
      } catch (err) { console.error("load piece content", err); }
      return;
    }
    if (action === "piece-add-term") {
      const piece = state.studio.pieces.find(p => p.id === id);
      if (!piece) return;
      try {
        const row = await studioInsert("glossary_terms", {
          term: "",
          definition: "",
          source_title: piece.title || "",
          source_url: piece.url || "",
          source_piece_id: piece.id,
          source_type: piece.category || ""
        });
        state.studio.glossary.unshift(row);
        await logRepurpose(piece.id, "add-term", "Added a glossary term", null);
        state.studioModal = { type: "glossary", item: row };
        render();
      } catch (err) { showSaveError(err.message); }
      return;
    }

    /* ----- Repurpose history ----- */
    if (action === "rh-add-toggle") {
      if (state.studioModal && state.studioModal.type === "piece") {
        state.studioModal.rhAddOpen = !state.studioModal.rhAddOpen;
        render();
        if (state.studioModal.rhAddOpen) {
          setTimeout(() => {
            const el = document.getElementById("rhAddAction");
            if (el) el.focus();
          }, 50);
        }
      }
      return;
    }
    if (action === "rh-add-save") {
      const wasUntouched = !(state.studio.rhByPiece[id] || []).length;
      const actionLabel = (document.getElementById("rhAddAction")?.value || "").trim();
      const note = (document.getElementById("rhAddNote")?.value || "").trim();
      const url = (document.getElementById("rhAddUrl")?.value || "").trim();
      if (!actionLabel) { showSaveError("Action label is required"); return; }
      try {
        const userId = state.session.user.id;
        const { data, error } = await sbStudio.from("repurpose_history").insert([{
          piece_id: id, user_id: userId, action: actionLabel,
          note: note || null, url: url || null
        }]).select().single();
        if (error) throw error;
        (state.studio.rhByPiece[id] = state.studio.rhByPiece[id] || []).unshift(data);
        if (state.studioModal) state.studioModal.rhAddOpen = false;
        render();
        markMade(id, wasUntouched);
      } catch (err) { showSaveError(err.message); }
      return;
    }
    if (action === "rh-delete") {
      const rhId = e && e.currentTarget && e.currentTarget.dataset.rhId;
      if (!rhId) return;
      if (!confirm("Delete this repurpose-history entry?")) return;
      try {
        await studioDelete("repurpose_history", rhId);
        const arr = state.studio.rhByPiece[id] || [];
        const idx = arr.findIndex(x => x.id === rhId);
        if (idx >= 0) arr.splice(idx, 1);
        render();
      } catch (err) { showSaveError(err.message); }
      return;
    }

    /* ----- Add a piece by URL via the corpus-add function ----- */
    if (action === "piece-add-by-url") {
      const url = prompt("URL to add to the corpus:");
      if (!url || !/^https?:\/\//i.test(url)) return;
      flashSaving();
      try {
        const { piece, already_existed } = await studioApiJson("/api/corpus-add", { url });
        if (already_existed) {
          alert("Already in corpus: " + (piece && piece.title || "(unknown)"));
        }
        if (piece) {
          state.studio.pieces.unshift({
            id: piece.id, url: piece.url, title: piece.title, category: piece.category,
            excerpt: piece.excerpt, char_count: piece.char_count
          });
          state.studio.piecesCount = state.studio.pieces.length;
          state.piecesUI.query = "";
          state.piecesUI.searchMatchIds = null;
          state.piecesUI.shown = PIECES_PAGE_SIZE;
          render();
        }
      } catch (err) { showSaveError(err.message); }
      return;
    }

    /* ----- AI: per-piece ----- */
    if (action === "ai-refresher")   { return runAiStreamingAction({ pieceId: id, action, title: "Refresher + repurpose ideas" }); }
    if (action === "ai-linkedin")    { return runAiStreamingAction({ pieceId: id, action, title: "LinkedIn drafts" }); }
    if (action === "ai-thread")      { return runAiStreamingAction({ pieceId: id, action, title: "X/Twitter thread" }); }
    if (action === "ai-quote-cards") { return runAiStreamingAction({ pieceId: id, action, title: "Quote cards" }); }
    if (action === "ai-related")     { return runAiRelatedAction({ pieceId: id, title: "Related content" }); }

    /* ----- AI: corpus observations ----- */
    if (action === "obs-observations") { return runAiObservationAction({ mode: "observations", title: "Emerging themes" }); }
    if (action === "obs-idle")         { return runAiObservationAction({ mode: "idle", title: "Idle / orphaned" }); }
    if (action === "obs-clusters")     { return runAiObservationAction({ mode: "clusters", title: "Theme clusters" }); }

    /* ----- AI: idea generators ----- */
    if (action === "idea-playbook")            { return runAiIdeasAction({ mode: "playbook", title: "Themed Playbook ideas" }); }
    if (action === "idea-playbook-topic")      {
      const topic = prompt("What topic should the Playbook cover?");
      if (!topic) return;
      return runAiIdeasAction({ mode: "playbook-topic", topic, title: `Playbook on: ${topic}` });
    }
    if (action === "idea-compilation")         { return runAiIdeasAction({ mode: "compilation", title: "Single-theme compilation ideas" }); }
    if (action === "idea-thread")              { return runAiIdeasAction({ mode: "thread", title: "Thread candidates" }); }
    if (action === "idea-linkedin-candidates") { return runAiIdeasAction({ mode: "linkedin-candidates", title: "LinkedIn candidates" }); }
    if (action === "idea-quote-candidates")    { return runAiIdeasAction({ mode: "quote-candidates", title: "Quote-dense pieces" }); }
    if (action === "idea-video")               { return runAiIdeasAction({ mode: "video", title: "Video candidates" }); }
    if (action === "idea-resurface")           { return runAiIdeasAction({ mode: "resurface", title: "Resurface candidates" }); }
    if (action === "idea-freeform") {
      const el = document.getElementById("ideaFreeForm");
      const topic = (el && el.value || "").trim();
      if (!topic) { showSaveError("Type a question first."); return; }
      return runAiIdeasAction({ mode: "free-form", topic: `Drawing on my content corpus: ${topic}`, title: "Free-form query" });
    }

    /* ----- AI modal chrome ----- */
    if (action === "ai-modal-close") {
      if (e && e.target && e.currentTarget && e.target !== e.currentTarget && !e.target.classList.contains("studio-modal-close") && e.target.dataset.studioAction !== "ai-modal-close") return;
      state.aiModal = null; render(); return;
    }
    if (action === "ai-save-history") { return saveAiOutputToHistory(); }
    if (action === "enrich-run") {
      const job = e && e.currentTarget && e.currentTarget.dataset.job;
      const kEl = document.getElementById("clusterK");
      if (kEl) state.enrich.k = Math.min(30, Math.max(4, parseInt(kEl.value, 10) || 18));
      if (job) runEnrichJob(job);
      return;
    }
    if (action === "enrich-stop") { state.enrich.stop = true; enrichLog("Stopping after this pass…"); return; }
    if (action === "mark-tap") { if (window.__markTap) window.__markTap(); return; }
    if (action === "stat-jump") {
      const where = e && e.currentTarget && e.currentTarget.dataset.jump;
      if (where === "untouched") {
        state.piecesUI.underRepurposed = true;
        state.piecesUI.category = "all";
        state.piecesUI.query = "";
        state.piecesUI.searchMatchIds = null;
        state.piecesUI.shown = PIECES_PAGE_SIZE;
        goTab("pieces");
      } else if (where === "pieces") {
        state.piecesUI.underRepurposed = false;
        goTab("pieces");
      } else if (where === "glossary") {
        goTab("glossary");
      }
      return;
    }
    if (action === "ai-copy") {
      const m = state.aiModal;
      if (m && m.output) {
        navigator.clipboard.writeText(m.output);
        showToast("Copied to clipboard");
      }
      return;
    }
  }

  function handleStudioFieldChange(el) {
    const m = state.studioModal;
    if (!m || !m.item) return;
    const field = el.dataset.field;
    const value = el.value;
    const tableMap = { inbox: "inbox_items", glossary: "glossary_terms" };
    const table = tableMap[m.type];
    if (!table) return;
    m.item[field] = value;
    studioSchedulePatch(table, m.item.id, field, value);
  }

  /* =====================================================================
     EVENT BINDING
     ===================================================================== */
  function bindAppEvents() {
    document.querySelectorAll("[data-studio-tab]").forEach(el => {
      el.addEventListener("click", () => goTab(el.dataset.studioTab));
    });
    document.querySelectorAll("[data-studio-action]").forEach(el => {
      el.addEventListener("click", (e) => handleStudioAction(e, el.dataset.studioAction, el.dataset.id));
    });
    // Autosave fields inside any open studio modal
    document.querySelectorAll(".studio-modal [data-field]").forEach(el => {
      el.addEventListener("input", () => handleStudioFieldChange(el));
      el.addEventListener("change", () => handleStudioFieldChange(el));
    });
    document.querySelectorAll("[data-action='signout']").forEach(el => {
      el.addEventListener("click", () => signOut());
    });
    document.querySelectorAll("[data-action='account']").forEach(el => {
      el.addEventListener("click", () => openAccountModal());
    });

    // Free-form idea box: Enter submits
    const freeform = document.getElementById("ideaFreeForm");
    if (freeform) {
      freeform.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); handleStudioAction(null, "idea-freeform"); }
      });
    }

    // Pieces search — instant client-side filter, server-side content search
    // lands ~250ms later and broadens the result set.
    const searchEl = document.getElementById("piecesSearch");
    if (searchEl) {
      let t;
      searchEl.addEventListener("input", () => {
        state.piecesUI.query = searchEl.value;
        state.piecesUI.shown = PIECES_PAGE_SIZE;
        state.piecesUI.searchMatchIds = null;   // stale results — new query in flight
        clearTimeout(t);
        t = setTimeout(async () => {
          render();
          restoreSearchFocus();
          await runPiecesSearch(searchEl.value);
          render();
          restoreSearchFocus();
        }, 250);
      });
    }
    function restoreSearchFocus() {
      const again = document.getElementById("piecesSearch");
      if (again && document.activeElement !== again) {
        again.focus();
        const v = again.value;
        again.setSelectionRange(v.length, v.length);
      }
    }
  }

  // Escape closes whichever modal is open
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (state.aiModal) { state.aiModal = null; render(); return; }
    if (state.studioModal) { state.studioModal = null; render(); return; }
  });


  /* =====================================================================
     PRESENTS — every day, once a day.
     Type the word anywhere outside a text field. Type it again to undo.
     Nothing here is visible unless you go looking for it.
       dusk     violet/amber palette
       coffee   Cooper mode: the AI status line gets opinions
       owls     ...
       lupus    the constellation, briefly, over the masthead
       mothman  a small acknowledgement
     Plus: tap the P. mark seven times.
     ===================================================================== */
  let cooperMode = false;

  const COOPER_LINES = [
    "Damn fine corpus.",
    "Every day, once a day, give yourself a present.",
    "Diane, I'm holding in my hand 689 pieces.",
    "The owls are not what they seem.",
    "There's always music in the air.",
    "I have no idea where this will lead us.",
  ];
  function aiStatusText() {
    if (!cooperMode) return "Generating…";
    return COOPER_LINES[Math.floor(Math.random() * COOPER_LINES.length)];
  }

  function drawLupus() {
    const svg = document.getElementById("lupus");
    if (!svg) return;
    // Lupus, the Wolf. Approximate, and generous about it.
    const stars = [[18,64],[46,48],[74,58],[96,34],[124,44],[150,22],[178,38],[206,18],[136,72],[168,66]];
    const links = [[0,1],[1,2],[2,4],[1,3],[3,5],[5,6],[6,7],[4,8],[8,9],[9,6]];
    svg.innerHTML =
      links.map(([a,b]) => `<line x1="${stars[a][0]}" y1="${stars[a][1]}" x2="${stars[b][0]}" y2="${stars[b][1]}"/>`).join("") +
      stars.map(([x,y],i) => `<circle cx="${x}" cy="${y}" r="${i % 3 === 0 ? 2.2 : 1.5}"/>`).join("");
    svg.classList.add("lit");
    setTimeout(() => svg.classList.remove("lit"), 4200);
  }


  /* The tool exists to get work out of the archive. Logging that is the
     moment worth marking, so it gets one. */
  function markMade(pieceId, wasUntouched) {
    const total = Object.values(state.studio.rhByPiece)
      .reduce((n, arr) => n + (arr ? arr.length : 0), 0);
    const piece = state.studio.pieces.find(p => p.id === pieceId);
    const title = (piece && piece.title) || "that piece";

    const row = document.querySelector(".pm-rh-list li");
    if (row) { row.classList.add("just-made"); setTimeout(() => row.classList.remove("just-made"), 1800); }

    if (wasUntouched) {
      showToast(cooperMode
        ? `First time out for ${title}. It's been waiting.`
        : `First use of ${title}. ${total} things made from the archive.`);
    } else if (total % 25 === 0) {
      showToast(`${total} things made from this archive.`);
    } else {
      showToast(cooperMode ? "Logged. Damn fine." : `Logged. ${total} and counting.`);
    }
  }

  function corpusBrag() {
    const ps = state.studio.pieces || [];
    const n = state.studio.piecesCount || 0;
    const chars = ps.reduce((s, p) => s + (p.char_count || 0), 0);
    const words = Math.round(chars / 5.6);
    const novels = Math.max(1, Math.round(words / 80000));
    const longest = ps.reduce((a, b) => ((b.char_count || 0) > (a.char_count || 0) ? b : a), ps[0] || {});
    const made = Object.values(state.studio.rhByPiece)
      .reduce((t, arr) => t + (arr ? arr.length : 0), 0);
    const lines = [
      `${n} pieces · ${words.toLocaleString()} words · about ${novels} novels, and you edited all of them.`,
      `Longest piece: ${(longest && longest.title) || "—"}, at ${Math.round((longest.char_count || 0) / 1000)}k characters.`,
      `${made} things made from this archive so far.`,
    ];
    showToast(lines[Math.floor(Math.random() * lines.length)]);
  }

  /* ---------------------------------------------------------------
     Presentable mode. One switch puts everything back to PE navy and
     turns Cooper mode off, for when the laptop gets turned around.
     Your own preferences are remembered underneath and come back when
     you switch off. It persists, so a reload mid-demo stays safe.

       Cmd/Ctrl + Shift + .    works anywhere, even mid-sentence
       type "present"          outside a text field
       double-click the date   no keyboard at all
     --------------------------------------------------------------- */
  let presenting = false;

  function readPrefs() {
    try {
      presenting = localStorage.getItem("studio-presenting") === "1";
      const wantsDusk  = localStorage.getItem("studio-dusk") === "1";
      const wantsOwls  = localStorage.getItem("studio-cooper") === "1";
      document.documentElement.classList.toggle("dusk", wantsDusk && !presenting);
      cooperMode = wantsOwls && !presenting;
    } catch (e) {}
  }
  readPrefs();

  function togglePresentable() {
    presenting = !presenting;
    try { localStorage.setItem("studio-presenting", presenting ? "1" : "0"); } catch (e) {}
    readPrefs();
    const owl = document.getElementById("owlMark");
    if (owl) owl.hidden = !cooperMode;
    // Silent going in — nothing should appear on screen as you turn it around.
    if (!presenting) {
      showToast(document.documentElement.classList.contains("dusk")
        ? "Back to dusk." : "Back to normal.");
    }
  }

  (() => {
    let buf = "";
    let taps = 0, tapTimer = null;

    const triggers = {
      dusk() {
        const on = !document.documentElement.classList.contains("dusk");
        try {
          localStorage.setItem("studio-dusk", on ? "1" : "0");
          if (on) { localStorage.setItem("studio-presenting", "0"); }
        } catch (e) {}
        readPrefs();
        showToast(on ? "Entre chien et loup." : "Back to daylight.");
      },
      present() { togglePresentable(); },
      coffee() {
        cooperMode = !cooperMode;
        try {
          localStorage.setItem("studio-cooper", cooperMode ? "1" : "0");
          if (cooperMode) localStorage.setItem("studio-presenting", "0");
          presenting = false;
        } catch (e) {}
        const owl = document.getElementById("owlMark");
        if (owl) owl.hidden = !cooperMode;
        showToast(cooperMode ? "Damn fine. Cooper mode on." : "Cooper mode off.");
      },
      owls() { showToast("The owls are not what they seem."); },
      lupus() { drawLupus(); },
      mothman() { showToast("Point Pleasant, 1966. Still no notes."); },
    };

    // Cmd/Ctrl + Shift + .  — the heavy period. Works even while typing.
    document.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.shiftKey && (e.key === "." || e.key === ">")) {
        e.preventDefault();
        togglePresentable();
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.key.length !== 1 || e.metaKey || e.ctrlKey || e.altKey) return;
      const t = e.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
      buf = (buf + e.key.toLowerCase()).slice(-10);
      for (const word in triggers) {
        if (buf.endsWith(word)) { triggers[word](); buf = ""; break; }
      }
    });

    // Seven taps on the P.
    window.__markTap = () => {
      taps++;
      clearTimeout(tapTimer);
      tapTimer = setTimeout(() => { taps = 0; }, 2400);
      if (taps >= 7) {
        taps = 0;
        const mark = document.querySelector(".pe-mark");
        if (mark) { mark.classList.add("spun"); setTimeout(() => mark.classList.remove("spun"), 950); }
        corpusBrag();
      }
    };
  })();

  window.addEventListener("hashchange", render);
  bootApp();
})();

</script>
</body>
